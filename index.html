<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Сценарии</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f0e8;
    --surface: #fefcf7;
    --surface2: #f0ebe0;
    --border: #e2d9c8;
    --accent: #b5622a;
    --accent2: #d4804a;
    --text: #1e1810;
    --text2: #6b5d4f;
    --muted: #a0917f;
    --radius: 16px;
    --shadow: 0 1px 4px rgba(0,0,0,0.08), 0 2px 12px rgba(0,0,0,0.04);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding-bottom: 90px;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px 8px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 8px rgba(0,0,0,0.06);
  }

  .header-line1 {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 7px;
  }
  .header-line2 {
    display: flex;
    align-items: center;
    gap: 7px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .header-line2::-webkit-scrollbar { display: none; }

  .project-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    color: var(--text);
    font-size: 15.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }

  /* counter as pill — same row as filters */
  .counter-pill {
    font-size: 11px;
    font-weight: 700;
    color: var(--text2);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* hero filter pills — same row */
  .hero-pill {
    flex-shrink: 0;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .hero-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── LIST ── */
  .list { padding: 12px 12px 0; display: flex; flex-direction: column; gap: 10px; }

  .section-label {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1.2px;
    padding: 8px 2px 2px;
    display: flex; align-items: center; gap: 6px;
  }

  /* ── CARDS ── */
  .scenario-card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .scenario-card.status-draft { background: #fafaf8; border-color: #ddd; opacity: 0.82; }
  .scenario-card.status-done { background: #f8faf8; border-color: #cddccd; opacity: 0.65; }

  .status-bar { height: 3px; }
  .status-active .status-bar { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .status-draft .status-bar { background: #c4c9d0; }
  .status-done .status-bar { background: #7db87d; }

  .card-main { display: flex; align-items: flex-start; gap: 10px; padding: 12px 12px 10px; }

  .num {
    font-family: 'Playfair Display', serif; font-size: 20px;
    color: var(--accent); min-width: 26px; text-align: center;
    line-height: 1.1; padding-top: 2px; flex-shrink: 0;
  }
  .status-draft .num { color: #aaa; }
  .status-done .num { color: #7db87d; }

  .card-content { flex: 1; min-width: 0; }

  .card-hero {
    font-size: 10px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.8px;
    margin-bottom: 3px; display: flex; align-items: center; gap: 4px;
  }
  .status-draft .card-hero { color: var(--muted); }
  .status-done .card-hero { color: #7db87d; }

  .card-title { font-weight: 600; font-size: 15px; color: var(--text); line-height: 1.4; }
  .status-draft .card-title { color: var(--text2); }
  .status-done .card-title { text-decoration: line-through; color: var(--muted); }

  .card-desc {
    font-size: 13px; color: var(--text2); margin-top: 4px; line-height: 1.5;
    white-space: pre-wrap; /* preserve line breaks */
  }
  .link-preview {
    margin-top: 6px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    display: flex;
    align-items: stretch;
    text-decoration: none;
    color: inherit;
  }
  .link-preview-img {
    width: 84px;
    height: 84px;
    flex-shrink: 0;
    object-fit: cover;
    display: block;
    background: var(--surface2);
  }
  .link-preview-body {
    padding: 7px 8px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .link-preview-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    line-clamp: 2;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-decoration: none;
  }
  .link-preview-domain {
    margin-top: 2px;
    font-size: 10px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* photo strip */
  .card-photos {
    display: flex; gap: 6px;
    overflow-x: auto; scrollbar-width: none;
    padding: 0 12px 10px;
  }
  .card-photos::-webkit-scrollbar { display: none; }

  .card-photo {
    width: 72px; height: 72px; border-radius: 10px;
    object-fit: cover; flex-shrink: 0;
    border: 1px solid var(--border); cursor: pointer;
    transition: opacity 0.15s;
  }
  .card-photo:active { opacity: 0.8; }

  .status-btn {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px solid var(--border); background: var(--surface2);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s; margin-top: 2px;
  }
  .status-active .status-btn { border-color: var(--accent); background: #fdf3ec; }
  .status-draft .status-btn { border-color: #ccc; background: #f5f5f5; }
  .status-done .status-btn { border-color: #7db87d; background: #edf5ed; }

  .card-footer { display: none; }

  .edit-circle {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px solid var(--border); background: var(--surface2);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s; margin-top: 6px; color: var(--muted);
  }
  .edit-circle:hover { border-color: var(--accent); color: var(--accent); background: #fdf3ec; }

  .card-date { font-size: 10px; color: var(--muted); margin-top: 1px; }

  .multi-select-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    margin-top: 3px;
  }
  .multi-select-btn.selected {
    border-color: var(--accent);
    background: #fdf3ec;
    color: var(--accent);
  }

  /* ── FAB ── */
  .fab {
    position: fixed; bottom: 70px; right: 14px;
    width: 50px; height: 50px; border-radius: 50%;
    background: var(--accent); border: none; color: #fff;
    cursor: pointer; box-shadow: 0 4px 20px rgba(181,98,42,0.35);
    display: flex; align-items: center; justify-content: center;
    z-index: 150; transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.92); }

  /* ── FAST SCROLL ── */
  .fast-scroll-track {
    position: fixed;
    right: 4px;
    top: 84px;
    bottom: 76px;
    width: 20px;
    z-index: 140;
    display: none;
    touch-action: none;
  }
  .fast-scroll-thumb {
    position: absolute;
    right: 3px;
    width: 14px;
    border-radius: 10px;
    background: rgba(181, 98, 42, 0.75);
    box-shadow: 0 1px 4px rgba(0,0,0,0.18);
    min-height: 28px;
    opacity: 0.14;
    transition: background 0.15s, opacity 0.2s;
  }
  .fast-scroll-track.active .fast-scroll-thumb { opacity: 0.78; }
  .fast-scroll-track.dragging .fast-scroll-thumb {
    background: rgba(181, 98, 42, 0.95);
    opacity: 0.95;
  }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1.5px solid var(--border);
    display: flex; align-items: stretch; z-index: 200;
    box-shadow: 0 -2px 16px rgba(0,0,0,0.07);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-projects { display: flex; flex: 1; overflow-x: auto; scrollbar-width: none; }
  .nav-projects::-webkit-scrollbar { display: none; }

  .nav-item {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px 14px; cursor: pointer; border: none; background: transparent;
    font-family: 'Inter', sans-serif; gap: 4px; min-width: 70px;
    flex-shrink: 0; transition: background 0.15s; position: relative;
  }
  .nav-item.active::after {
    content: ''; position: absolute; top: 0; left: 12px; right: 12px;
    height: 2.5px; border-radius: 0 0 3px 3px; background: var(--nav-color, var(--accent));
  }
  .nav-dot { width: 8px; height: 8px; border-radius: 50%; transition: transform 0.15s; }
  .nav-item.active .nav-dot { transform: scale(1.3); }
  .nav-label {
    font-size: 10px; font-weight: 600; color: var(--muted);
    max-width: 68px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; text-align: center;
  }
  .nav-item.active .nav-label { color: var(--text); }

  .nav-actions {
    display: flex;
    flex-shrink: 0;
    border-left: 1px solid var(--border);
  }
  .nav-add-project, .nav-calendar {
    width: 46px; border: none;
    background: transparent; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--muted); flex-shrink: 0; transition: color 0.2s;
  }
  .nav-add-project:hover, .nav-calendar:hover { color: var(--accent); }

  .calendar-month {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .calendar-month-title {
    font-family: 'Playfair Display', serif;
    color: var(--accent);
    font-size: 18px;
    text-transform: capitalize;
  }
  .calendar-nav-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    /* Чтобы все клетки календаря были одинаковой высоты */
    grid-auto-rows: 46px;
  }
  .calendar-weekday {
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
  }
  .calendar-day {
    border: 1.5px solid var(--border);
    border-radius: 10px;
    min-height: 46px;
    height: 46px; /* фиксируем высоту, чтобы 1/2/3 не становились огромными */
    background: var(--surface);
    padding: 4px 3px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative; /* нужно для "плюсика" в правом верхнем углу */
    font-family: inherit;
  }
  .calendar-day.empty {
    border-color: transparent;
    background: transparent;
    cursor: default;
    height: 46px;
  }
  .calendar-day-num {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
  }
  .calendar-day.selected {
    border-color: var(--accent);
    background: #fdf3ec;
  }

  /* Серый "плюсик" на пустых датах (для быстрого планирования) */
  .calendar-add-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 18px;
    height: 18px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.02);
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .calendar-add-btn:hover {
    border-color: var(--muted);
  }
  .calendar-dot {
    margin-top: 4px;
    min-width: 14px;
    height: 14px;
    border-radius: 9px;
    padding: 0 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
  }
  .calendar-plan-list {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .calendar-plan-item {
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text);
    line-height: 1.4;
  }
  .calendar-plan-empty {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 10px 0;
  }

  /* ── FULLSCREEN MODAL ── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: var(--bg); z-index: 300; flex-direction: column;
  }
  .overlay.open { display: flex; }

  .modal-header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .modal-back {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: var(--surface2); cursor: pointer; display: flex;
    align-items: center; justify-content: center; color: var(--text2);
    flex-shrink: 0;
  }
  .modal-header-title {
    font-family: 'Playfair Display', serif; color: var(--accent); font-size: 18px; flex: 1;
  }

  .modal-body {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 14px;
  }

  .field label {
    display: block; font-size: 11px; font-weight: 700; color: var(--muted);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.6px;
  }

  .field input, .field textarea {
    width: 100%; background: var(--surface);
    border: 1.5px solid var(--border); border-radius: 12px;
    padding: 12px 14px; color: var(--text); font-family: 'Inter', sans-serif;
    font-size: 15px; outline: none; transition: border-color 0.2s; -webkit-appearance: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 160px; }

  .hero-quick { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 8px; }
  .hero-quick-btn {
    padding: 5px 13px; border-radius: 20px; border: 1.5px solid var(--border);
    background: var(--surface2); color: var(--text2); font-size: 12px; font-weight: 600;
    font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.18s;
  }
  .hero-quick-btn.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

  .status-select { display: flex; gap: 8px; }
  .status-opt {
    flex: 1; padding: 9px 4px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--surface2); color: var(--text2); font-size: 11px; font-weight: 600;
    font-family: 'Inter', sans-serif; cursor: pointer; text-align: center;
    transition: all 0.18s; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .status-opt.selected { border-color: var(--accent); background: #fdf3ec; color: var(--accent); }
  .status-opt.selected.draft { border-color: #9ca3af; background: #f3f4f6; color: #6b7280; }
  .status-opt.selected.done { border-color: #7db87d; background: #edf5ed; color: #5a9e5a; }

  /* multi photo upload */
  .photos-upload-strip {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px;
  }
  .photos-upload-strip::-webkit-scrollbar { display: none; }

  .photo-thumb-wrap {
    position: relative; flex-shrink: 0;
  }
  .photo-thumb-wrap img {
    width: 72px; height: 72px; border-radius: 10px; object-fit: cover;
    border: 1.5px solid var(--border); display: block;
  }
  .photo-remove {
    position: absolute; top: -6px; right: -6px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #c0392b; border: 2px solid #fff; color: #fff;
    font-size: 12px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .add-photo-btn {
    width: 72px; height: 72px; border-radius: 10px;
    border: 2px dashed var(--border); background: var(--surface2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; color: var(--muted); font-size: 10px; font-weight: 600;
    gap: 4px; flex-shrink: 0; transition: border-color 0.2s;
  }
  .add-photo-btn:hover { border-color: var(--accent); color: var(--accent); }

  .modal-footer {
    padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
  }

  .btn-row { display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 13px; border-radius: 14px; border: none;
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.82; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-cancel { background: var(--surface2); color: var(--text2); border: 1.5px solid var(--border); }

  .btn-delete {
    width: 100%; padding: 12px; border-radius: 14px;
    border: 1.5px solid #e8c4c4; background: #fdf5f5; color: #c0392b;
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }

  /* Project modal — still bottom sheet */
  .proj-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(30,24,16,0.45); z-index: 400;
    align-items: flex-end; backdrop-filter: blur(2px);
  }
  .proj-overlay.open { display: flex; }
  .proj-modal {
    background: var(--surface); border-radius: 24px 24px 0 0;
    padding: 20px 18px 44px; width: 100%;
    max-height: 80vh; overflow-y: auto;
    border-top: 1.5px solid var(--border);
  }
  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
  .proj-title { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 19px; margin-bottom: 18px; text-align: center; }

  .proj-field { margin-bottom: 13px; }
  .proj-field label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.6px; }
  .proj-field input {
    width: 100%; background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 11px 13px; color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 15px; outline: none; -webkit-appearance: none;
  }
  .proj-field input:focus { border-color: var(--accent); }

  .color-picker { display: flex; gap: 10px; flex-wrap: wrap; }
  .color-opt {
    width: 32px; height: 32px; border-radius: 50%;
    border: 3px solid transparent; cursor: pointer; transition: transform 0.15s, border-color 0.15s;
  }
  .color-opt.selected { border-color: var(--text); transform: scale(1.15); }

  /* Lightbox */
  .lightbox {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.92); z-index: 500;
    align-items: center; justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100vh; object-fit: contain; }
  .lightbox-close {
    position: absolute; top: 16px; right: 16px;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: none; color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  /* Empty / Loading */
  .empty { text-align: center; padding: 56px 20px; color: var(--muted); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
  .empty p { font-size: 14px; line-height: 1.6; }

  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .spinner {
    width: 28px; height: 28px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 12px;
  }

<script>
const SUPABASE_URL = 'https://ffytgashtdnaahntrudq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmeXRnYXNodGRuYWFobnRydWRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5OTgwMzEsImV4cCI6MjA5MzU3NDAzMX0.9erqgwkjDmmpnN0vJgc2oNnGjM7r_tMWihF3dTggswQ';
const H = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };
// Названия бакетов (папок) в Supabase Storage
// scenarios — фото/файлы внутри карточек сценариев
// media — отдельная медиатека (стоки, исходники, тяжёлые видео)
const BUCKET_SCENARIOS = 'scenarios';
const BUCKET_MEDIA = 'media';
const COLORS = ['#b5622a','#c0392b','#8e44ad','#2980b9','#16a085','#27ae60','#f39c12','#d35400','#2c3e50','#7f8c8d'];

let projects = [], scenarios = [];
let currentProjectId = null, editingScenarioId = null, editingProjectId = null;
let filterHero = null, currentStatus = 'active', selectedColor = COLORS[0];
let pendingPhotos = []; // { url, file, isExisting }
let scenarioDraftCache = null; // autosave for unsaved new scenario
let draftAutosaveTimer = null;
const linkPreviewCache = {}; // url -> { title, image, domain } | { failed: true }
const linkPreviewLoading = new Set();
let lightboxScrollY = 0;
let fastScrollDragging = false;
let fastScrollPointerId = null;
let fastScrollFadeTimer = null;
let selectionMode = false;
let selectedScenarioIds = new Set();
const LS_PROJECTS_KEY = 'iritual_projects_cache_v1';
const LS_SCENARIOS_KEY = 'iritual_scenarios_cache_v1';
const LS_OFFLINE_QUEUE_KEY = 'iritual_offline_queue_v1';
const LS_RELEASE_PLAN_KEY = 'iritual_release_plan_v1';
let scenariosByProjectCache = {};
let offlineQueue = [];
let syncingOfflineQueue = false;
let releasePlanByProject = {};
let calendarCurrentMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let calendarSelectedDate = '';
let calendarPickDate = ''; // дата, для которой сейчас выбираем сценарий через "+"

function isNetworkError(e) {
  const msg = (e && e.message ? e.message : String(e || '')).toLowerCase();
  return !navigator.onLine || msg.includes('failed to fetch') || msg.includes('networkerror');
}

function loadOfflineState() {
  try { projects = JSON.parse(localStorage.getItem(LS_PROJECTS_KEY) || '[]') || []; } catch(e) { projects = []; }
  try { scenariosByProjectCache = JSON.parse(localStorage.getItem(LS_SCENARIOS_KEY) || '{}') || {}; } catch(e) { scenariosByProjectCache = {}; }
  try { offlineQueue = JSON.parse(localStorage.getItem(LS_OFFLINE_QUEUE_KEY) || '[]') || []; } catch(e) { offlineQueue = []; }
  try { releasePlanByProject = JSON.parse(localStorage.getItem(LS_RELEASE_PLAN_KEY) || '{}') || {}; } catch(e) { releasePlanByProject = {}; }
}

function persistProjectsCache() {
  localStorage.setItem(LS_PROJECTS_KEY, JSON.stringify(projects));
}

function persistScenariosCache() {
  if (currentProjectId) scenariosByProjectCache[currentProjectId] = scenarios;
  localStorage.setItem(LS_SCENARIOS_KEY, JSON.stringify(scenariosByProjectCache));
}

function saveOfflineQueue() {
  localStorage.setItem(LS_OFFLINE_QUEUE_KEY, JSON.stringify(offlineQueue));
}

function persistReleasePlan() {
  localStorage.setItem(LS_RELEASE_PLAN_KEY, JSON.stringify(releasePlanByProject));
}

function enqueueOfflineOp(op) {
  offlineQueue.push(op);
  saveOfflineQueue();
}

function replaceTempScenarioId(tempId, created) {
  const idx = scenarios.findIndex(s => s.id === tempId);
  if (idx !== -1) scenarios[idx] = created;
  const list = scenariosByProjectCache[created.project_id] || [];
  const cidx = list.findIndex(s => s.id === tempId);
  if (cidx !== -1) list[cidx] = created;
  const plan = getProjectReleasePlan(created.project_id);
  if (plan[tempId]) {
    plan[created.id] = plan[tempId];
    delete plan[tempId];
    persistReleasePlan();
  }
}

async function syncOfflineQueue() {
  if (syncingOfflineQueue || offlineQueue.length === 0 || !navigator.onLine) return;
  syncingOfflineQueue = true;
  try {
    while (offlineQueue.length > 0) {
      const op = offlineQueue[0];
      if (op.type === 'scenario_create') {
        const [created] = await api('/rest/v1/scenarios', 'POST', op.payload);
        replaceTempScenarioId(op.tempId, created);
      } else if (op.type === 'scenario_update') {
        await api(`/rest/v1/scenarios?id=eq.${op.id}`, 'PATCH', op.payload);
      } else if (op.type === 'scenario_delete') {
        await api(`/rest/v1/scenarios?id=eq.${op.id}`, 'DELETE');
      } else if (op.type === 'project_create') {
        await api('/rest/v1/projects', 'POST', op.payload);
      } else if (op.type === 'project_update') {
        await api(`/rest/v1/projects?id=eq.${op.id}`, 'PATCH', op.payload);
      } else if (op.type === 'project_delete') {
        await api(`/rest/v1/projects?id=eq.${op.id}`, 'DELETE');
      }
      offlineQueue.shift();
      saveOfflineQueue();
    }
    persistProjectsCache();
    persistScenariosCache();
    if (currentProjectId) await loadScenarios();
    showToast('Синхронизировано');
  } catch (e) {
    if (!isNetworkError(e)) {
      // keep queue item for manual retry after fixing server-side issue
    }
  } finally {
    syncingOfflineQueue = false;
  }
}

async function api(path, method = 'GET', body = null) {
  const res = await fetch(SUPABASE_URL + path, { method, headers: H, body: body ? JSON.stringify(body) : null });
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function init() {
  loadOfflineState();
  try {
    projects = await api('/rest/v1/projects?select=*&order=created_at.asc');
    persistProjectsCache();

    // Viewer: only show their project
    if (currentRole === 'viewer' && viewerProjectId) {
      projects = projects.filter(p => p.id === parseInt(viewerProjectId));
    }

    if (projects.length > 0) {
      currentProjectId = projects[0].id;
      await loadScenarios();
    } else showNoProject();
    renderNav();
    syncOfflineQueue();
  } catch(e) {
    if (projects.length > 0) {
      if (currentRole === 'viewer' && viewerProjectId) {
        projects = projects.filter(p => p.id === parseInt(viewerProjectId));
      }
      currentProjectId = projects[0] ? projects[0].id : null;
      if (currentProjectId) {
        scenarios = scenariosByProjectCache[currentProjectId] || [];
        render();
      } else showNoProject();
      renderNav();
      showToast('Оффлайн режим');
    } else {
      document.getElementById('main-content').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><p>Ошибка загрузки.</p></div>`;
    }
  }
}

async function loadScenarios() {
  if (!currentProjectId) return;
  document.getElementById('main-content').innerHTML = `<div class="loading"><div class="spinner"></div>Загрузка...</div>`;
  try {
    scenarios = await api(`/rest/v1/scenarios?select=*&project_id=eq.${currentProjectId}&order=position.asc,created_at.asc`);
    persistScenariosCache();
  } catch (e) {
    scenarios = scenariosByProjectCache[currentProjectId] || [];
    showToast('Оффлайн: показан кэш');
  }
  selectionMode = false;
  selectedScenarioIds.clear();
  filterHero = null;
  render();
  if (!isAdmin()) document.querySelector('.nav-add-project').style.display = 'none';
  if (isAdmin()) document.getElementById('fab').style.display = currentProjectId ? 'flex' : 'none';
}

function showNoProject() {
  document.getElementById('header-dot').style.background = 'transparent';
  document.getElementById('header-title').textContent = 'Сценарии';
  document.getElementById('counter').textContent = '';
  document.getElementById('fab').style.display = 'none';
  document.getElementById('main-content').innerHTML = `
    <div class="no-project">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <h2>Нет проектов</h2>
      <p>Создай первый проект для своего канала</p>
      <button onclick="openProjectModal()">Создать проект</button>
    </div>`;
}

function renderNav() {
  const el = document.getElementById('nav-projects');
  el.innerHTML = projects.map(p => `
    <button class="nav-item ${p.id === currentProjectId ? 'active' : ''}" style="--nav-color:${p.color}"
      onclick="switchProject(${p.id})" oncontextmenu="editProjectMenu(event,${p.id})">
      <div class="nav-dot" style="background:${p.color}"></div>
      <span class="nav-label">${p.name}</span>
    </button>`).join('');
}

async function switchProject(id) {
  if (id === currentProjectId) return;
  selectionMode = false;
  selectedScenarioIds.clear();
  currentProjectId = id; renderNav(); updateHeader(); await loadScenarios();
}

function updateHeader() {
  const p = projects.find(x => x.id === currentProjectId);
  if (!p) return;
  document.getElementById('header-dot').style.background = p.color;
  document.getElementById('header-title').textContent = p.name;
}

function getProjectReleasePlan(projectId = currentProjectId) {
  if (!projectId) return {};
  if (!releasePlanByProject[projectId]) releasePlanByProject[projectId] = {};
  return releasePlanByProject[projectId];
}

function getScenarioReleaseDate(scenarioId, projectId = currentProjectId) {
  const plan = getProjectReleasePlan(projectId);
  return plan[scenarioId] || '';
}

function setScenarioReleaseDate(scenarioId, dateStr, projectId = currentProjectId) {
  if (!projectId || !scenarioId) return;
  const plan = getProjectReleasePlan(projectId);
  if (dateStr) plan[scenarioId] = dateStr;
  else delete plan[scenarioId];
  persistReleasePlan();
}

function getActiveHeroes() {
  return [...new Set(scenarios.filter(s => s.status !== 'done' && s.hero).map(s => s.hero.trim()))];
}

function renderHeroFilter() {
  const row = document.getElementById('header-line2');
  row.querySelectorAll('.hero-pill').forEach(el => el.remove());

  const heroes = getActiveHeroes();
  if (heroes.length === 0) return;

  const allPill = document.createElement('button');
  allPill.className = `hero-pill${!filterHero ? ' active' : ''}`;
  allPill.textContent = 'Все';
  allPill.onclick = () => setFilter(null);
  row.appendChild(allPill);

  heroes.forEach(h => {
    const pill = document.createElement('button');
    pill.className = `hero-pill${filterHero === h ? ' active' : ''}`;
    pill.textContent = h;
    pill.onclick = () => setFilter(h);
    row.appendChild(pill);
  });
}

function setFilter(hero) { filterHero = hero; render(); }

function render() {
  updateHeader();
  renderHeroFilter();

  let list = [...scenarios];
  if (filterHero) list = list.filter(s => s.hero === filterHero);
  const q = getSearchQuery();
  if (q) list = list.filter(s =>
    (s.title || '').toLowerCase().includes(q) ||
    (s.description || '').toLowerCase().includes(q) ||
    (s.hero || '').toLowerCase().includes(q)
  );

  const active = list.filter(s => s.status === 'active');
  const draft = list.filter(s => s.status === 'draft');
  const done = list.filter(s => s.status === 'done');
  const el = document.getElementById('main-content');

  if (list.length === 0) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">✍️</div><p>${filterHero ? 'Нет сценариев для этого героя.' : 'Нажми + чтобы добавить первый сценарий.'}</p></div>`;
    updateCounter(); return;
  }

  let num = 1; let html = '<div class="list">';
  active.forEach(s => { html += cardHTML(s, num++); });
  if (draft.length > 0) {
    html += `<div class="section-label"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Надо доработать</div>`;
    draft.forEach(s => { html += cardHTML(s, null); });
  }
  if (done.length > 0) {
    html += `<div class="section-label"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Готовые</div>`;
    done.forEach(s => { html += cardHTML(s, null); });
  }
  html += '</div>';
  el.innerHTML = html;
  updateCounter();
  updateSelectionToggleVisibility();
  updateBatchBar();
  updateFastScroll();
  if (document.getElementById('calendar-overlay').classList.contains('open')) renderCalendar();
}

function cardHTML(s, num) {
  const status = s.status || 'active';
  const isSelected = selectedScenarioIds.has(s.id);
  const numStr = num !== null ? num : (status === 'done' ? '✓' : '–');
  const date = s.created_at ? new Date(s.created_at).toLocaleDateString('ru-RU', { day:'numeric', month:'short' }) : '';
  const heroName = s.hero || '';
  const hero = `<div class="card-hero">
    ${heroName ? `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${heroName}` : ''}
    ${date ? `<span style="font-weight:400;color:var(--muted);margin-left:${heroName ? 4 : 0}px">${date}</span>` : ''}
  </div>`;
  const desc = s.description ? `<div class="card-desc">${linkify(s.description)}${renderLinkPreview(s.description)}</div>` : '';
  const icon = status === 'active'
    ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 6 12 12 16 14"/></svg>`
    : status === 'draft'
    ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
    : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;

  let photos = [];
  if (s.image_url) {
    try { photos = JSON.parse(s.image_url); if (!Array.isArray(photos)) photos = [s.image_url]; }
    catch { photos = [s.image_url]; }
  }

  const photosHTML = photos.length > 0 ? `<div class="card-photos">${photos.map(url =>
    `<img class="card-photo" src="${url}" onclick="openLightbox('${url}')" onerror="this.style.display='none'">`
  ).join('')}</div>` : '';

  const editIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;

  const btns = `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0">
    <button class="status-btn" onclick="${isAdmin() ? `cycleStatus(${s.id})` : ''}" style="${isAdmin() ? '' : 'pointer-events:none;opacity:0.5'}">${icon}</button>
    ${isAdmin() ? `<button class="status-btn" onclick="editScenario(${s.id})" style="color:var(--muted)">${editIcon}</button>` : ''}
  </div>`;
  const selectBtn = (selectionMode && isAdmin())
    ? `<button class="multi-select-btn ${isSelected ? 'selected' : ''}" onclick="toggleScenarioSelection(${s.id})">${isSelected ? '✓' : ''}</button>`
    : '';

  return `
    <div class="scenario-card status-${status}">
      <div class="status-bar"></div>
      <div class="card-main">
        ${selectBtn}
        <div class="num">${numStr}</div>
        <div class="card-content">${hero}<div class="card-title">${escapeHtml(s.title)}</div>${desc}</div>
        ${btns}
      </div>
      ${photosHTML}
    </div>`;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateCounter() {
  const active = scenarios.filter(s => s.status === 'active').length;
  const draft = scenarios.filter(s => s.status === 'draft').length;
  document.getElementById('counter').textContent = `${active} акт · ${draft} черн`;
}

async function cycleStatus(id) {
  const s = scenarios.find(x => x.id === id); if (!s) return;
  const order = ['active','draft','done'];
  const next = order[(order.indexOf(s.status || 'active') + 1) % 3];
  try {
    await api(`/rest/v1/scenarios?id=eq.${id}`, 'PATCH', { status: next });
    s.status = next; render();
    persistScenariosCache();
    showToast({ active: 'Активный', draft: 'Доработать', done: 'Готово' }[next]);
  } catch(e) {
    if (!isNetworkError(e)) { showToast('Ошибка'); return; }
    s.status = next;
    enqueueOfflineOp({ type: 'scenario_update', id, payload: { status: next } });
    persistScenariosCache();
    render();
    showToast('Нет сети: изменено локально');
  }
}

async function deleteFromEdit() {
  if (!editingScenarioId || !confirm('Удалить сценарий?')) return;
  try {
    await api(`/rest/v1/scenarios?id=eq.${editingScenarioId}`, 'DELETE');
    scenarios = scenarios.filter(s => s.id !== editingScenarioId);
    setScenarioReleaseDate(editingScenarioId, '');
    persistScenariosCache();
    render(); closeScenarioModal(); showToast('Удалено');
  } catch(e) {
    if (!isNetworkError(e)) { showToast('Ошибка'); return; }
    scenarios = scenarios.filter(s => s.id !== editingScenarioId);
    setScenarioReleaseDate(editingScenarioId, '');
    enqueueOfflineOp({ type: 'scenario_delete', id: editingScenarioId });
    persistScenariosCache();
    render(); closeScenarioModal(); showToast('Нет сети: удаление в очереди');
  }
}

async function copyFromEdit() {
  if (!editingScenarioId) return;
  const copyBtn = document.getElementById('copy-btn');
  const copyIconDefault = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="9" y="9" width="11" height="11" rx="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
  `;
  const copyIconDone = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
  `;
  const showCopySuccess = () => {
    if (!copyBtn) return;
    copyBtn.style.borderColor = 'var(--accent)';
    copyBtn.style.background = '#fdf3ec';
    copyBtn.style.color = 'var(--accent)';
    copyBtn.innerHTML = copyIconDone;
    setTimeout(() => {
      copyBtn.style.borderColor = 'var(--border)';
      copyBtn.style.background = 'var(--surface2)';
      copyBtn.style.color = 'var(--muted)';
      copyBtn.innerHTML = copyIconDefault;
    }, 1000);
  };
  const title = document.getElementById('inp-title').value.trim();
  const desc = document.getElementById('inp-desc').value.trim();
  const text = desc ? `${title}\n${desc}` : title;
  if (!text) { showToast('Нечего копировать'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showToast('Скопировано');
    showCopySuccess();
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Скопировано');
    showCopySuccess();
  }
}

function selectStatus(val) {
  currentStatus = val;
  ['active','draft','done'].forEach(s => document.getElementById(`opt-${s}`).classList.remove('selected'));
  document.getElementById(`opt-${val}`).classList.add('selected');
  queueScenarioDraftAutosave();
}

function editScenario(id) {
  const s = scenarios.find(x => x.id === id); if (!s) return;
  editingScenarioId = id;
  document.getElementById('inp-hero').value = s.hero || '';
  document.getElementById('inp-title').value = s.title;
  document.getElementById('inp-desc').value = s.description || '';
  document.getElementById('inp-release-date').value = getScenarioReleaseDate(id);
  const preview = document.getElementById('desc-preview');
  preview.textContent = s.description || 'Нажми чтобы добавить описание...';
  preview.style.color = s.description ? 'var(--text)' : 'var(--muted)';
  selectStatus(s.status || 'active');
  document.getElementById('scenario-modal-title').textContent = 'Редактировать';
  document.getElementById('save-btn').textContent = 'Обновить';
  document.getElementById('copy-btn').style.cssText = 'display:flex;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;';
  document.getElementById('delete-btn').style.cssText = 'display:flex;width:36px;height:36px;border-radius:50%;border:1.5px solid #e8c4c4;background:#fdf5f5;color:#c0392b;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;';

  // Load existing photos
  pendingPhotos = [];
  if (s.image_url) {
    try {
      let urls = JSON.parse(s.image_url);
      if (!Array.isArray(urls)) urls = [s.image_url];
      urls.forEach(url => pendingPhotos.push({ url, file: null, isExisting: true }));
    } catch { pendingPhotos.push({ url: s.image_url, file: null, isExisting: true }); }
  }
  renderPhotosStrip();
  openScenarioModal({ fromEdit: true });
}

// ── PHOTOS ──
function handleFiles(e) {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    const url = URL.createObjectURL(file);
    pendingPhotos.push({ url, file, isExisting: false });
  });
  e.target.value = '';
  renderPhotosStrip();
  queueScenarioDraftAutosave();
}

function handlePasteImages(event) {
  if (!document.getElementById('scenario-overlay').classList.contains('open')) return;
  const items = event.clipboardData && event.clipboardData.items ? Array.from(event.clipboardData.items) : [];
  if (items.length === 0) return;

  const imageItems = items.filter(item => item.type && item.type.startsWith('image/'));
  if (imageItems.length === 0) return;

  let added = 0;
  imageItems.forEach(item => {
    const file = item.getAsFile();
    if (!file) return;
    const url = URL.createObjectURL(file);
    pendingPhotos.push({ url, file, isExisting: false });
    added++;
  });

  if (added > 0) {
    event.preventDefault();
    renderPhotosStrip();
    queueScenarioDraftAutosave();
    showToast(added === 1 ? 'Фото вставлено' : `Фото вставлены: ${added}`);
  }
}

function removePhoto(idx) {
  pendingPhotos.splice(idx, 1);
  renderPhotosStrip();
  queueScenarioDraftAutosave();
}

function renderPhotosStrip() {
  const strip = document.getElementById('photos-strip');
  let html = pendingPhotos.map((p, i) => `
    <div class="photo-thumb-wrap">
      <img src="${p.url}" onclick="openLightbox('${p.url}')">
      <div class="photo-remove" onclick="removePhoto(${i})">×</div>
    </div>`).join('');
  html += `<div class="add-photo-btn" onclick="document.getElementById('file-input').click()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    Добавить
  </div>`;
  strip.innerHTML = html;
}

function hasScenarioDraftContent(draft) {
  if (!draft) return false;
  return !!(draft.hero || draft.title || draft.desc || draft.releaseDate || (draft.photos && draft.photos.length > 0));
}

function queueScenarioDraftAutosave() {
  if (editingScenarioId) return;
  const overlay = document.getElementById('scenario-overlay');
  if (!overlay.classList.contains('open')) return;
  clearTimeout(draftAutosaveTimer);
  draftAutosaveTimer = setTimeout(() => {
    saveScenarioDraft();
  }, 350);
}

function saveScenarioDraft() {
  if (editingScenarioId) return; // only for "new scenario" modal
  const draft = {
    hero: document.getElementById('inp-hero').value || '',
    title: document.getElementById('inp-title').value || '',
    desc: document.getElementById('inp-desc').value || '',
    releaseDate: document.getElementById('inp-release-date').value || '',
    status: currentStatus || 'active',
    photos: pendingPhotos.map(p => ({ url: p.url, file: p.file, isExisting: p.isExisting }))
  };
  scenarioDraftCache = hasScenarioDraftContent(draft) ? draft : null;
  return !!scenarioDraftCache;
}

function restoreScenarioDraft() {
  if (!hasScenarioDraftContent(scenarioDraftCache)) return;
  document.getElementById('inp-hero').value = scenarioDraftCache.hero || '';
  document.getElementById('inp-title').value = scenarioDraftCache.title || '';
  document.getElementById('inp-desc').value = scenarioDraftCache.desc || '';
  document.getElementById('inp-release-date').value = scenarioDraftCache.releaseDate || '';
  const preview = document.getElementById('desc-preview');
  preview.textContent = scenarioDraftCache.desc || 'Нажми чтобы добавить описание...';
  preview.style.color = scenarioDraftCache.desc ? 'var(--text)' : 'var(--muted)';
  selectStatus(scenarioDraftCache.status || 'active');
  pendingPhotos = (scenarioDraftCache.photos || []).map(p => ({ url: p.url, file: p.file, isExisting: p.isExisting }));
  renderPhotosStrip();
  renderHeroQuick();
  showToast('Черновик восстановлен');
}

function clearScenarioDraft() {
  scenarioDraftCache = null;
}

async function uploadFileToBucket(file, bucketName = BUCKET_SCENARIOS) {
  const name = `${Date.now()}_${Math.random().toString(36).slice(2)}.${file.name.split('.').pop()}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${bucketName}/${name}`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': file.type },
    body: file
  });
  if (!res.ok) throw new Error('Upload failed');
  return `${SUPABASE_URL}/storage/v1/object/public/${bucketName}/${name}`;
}

function openScenarioModal(options = {}) {
  renderHeroQuick();
  history.pushState({ modal: 'scenario' }, '');
  document.getElementById('scenario-overlay').classList.add('open');
  if (!options.fromEdit) restoreScenarioDraft();
}

function closeScenarioModal(preserveDraft = true) {
  const savedDraft = preserveDraft ? saveScenarioDraft() : false;
  clearTimeout(draftAutosaveTimer);
  document.getElementById('scenario-overlay').classList.remove('open');
  document.getElementById('inp-hero').value = '';
  document.getElementById('inp-title').value = '';
  document.getElementById('inp-desc').value = '';
  document.getElementById('inp-release-date').value = '';
  const preview = document.getElementById('desc-preview');
  preview.textContent = 'Нажми чтобы добавить описание...';
  preview.style.color = 'var(--muted)';
  selectStatus('active');
  pendingPhotos = [];
  renderPhotosStrip();
  document.getElementById('scenario-modal-title').textContent = 'Новый сценарий';
  document.getElementById('save-btn').textContent = 'Сохранить';
  document.getElementById('copy-btn').style.display = 'none';
  document.getElementById('delete-btn').style.display = 'none';
  editingScenarioId = null;
  if (savedDraft) showToast('Черновик сохранен');
}

window.addEventListener('popstate', () => {
  if (document.getElementById('text-editor-overlay').classList.contains('open')) {
    closeTextEditor();
  } else if (document.getElementById('calendar-overlay').classList.contains('open')) {
    closeCalendarModal();
  } else if (document.getElementById('scenario-overlay').classList.contains('open')) {
    closeScenarioModal();
  } else if (document.getElementById('lightbox').classList.contains('open')) {
    closeLightbox(true);
  }
});

function renderHeroQuick() {
  const heroes = getActiveHeroes();
  const el = document.getElementById('hero-quick');
  if (heroes.length === 0) { el.innerHTML = ''; return; }
  const current = document.getElementById('inp-hero').value.trim();
  el.innerHTML = heroes.map(h => {
    const safe = h.replace(/'/g, "\\'");
    return `<button type="button" class="hero-quick-btn ${current === h ? 'selected' : ''}" onclick="selectHeroQuick('${safe}')">${h}</button>`;
  }).join('');
}

function selectHeroQuick(name) { document.getElementById('inp-hero').value = name; renderHeroQuick(); queueScenarioDraftAutosave(); }

async function saveScenario() {
  const title = document.getElementById('inp-title').value.trim();
  if (!title) { showToast('Введи название'); return; }
  const btn = document.getElementById('save-btn');
  btn.textContent = 'Сохраняю...'; btn.disabled = true;
  let payload = null;
  try {
    // Upload new files
    for (let p of pendingPhotos) {
      if (!p.isExisting && p.file) {
        // Загружаем фото сценария в бакет scenarios
        p.url = await uploadFileToBucket(p.file, BUCKET_SCENARIOS);
        p.isExisting = true;
      }
    }
    const urls = pendingPhotos.map(p => p.url);
    const image_url = urls.length > 0 ? JSON.stringify(urls) : null;

    payload = {
      title,
      description: document.getElementById('inp-desc').value || null,
      hero: document.getElementById('inp-hero').value.trim() || null,
      status: currentStatus,
      image_url,
      project_id: currentProjectId
    };

    const releaseDate = document.getElementById('inp-release-date').value || '';
    if (editingScenarioId) {
      await api(`/rest/v1/scenarios?id=eq.${editingScenarioId}`, 'PATCH', payload);
      const idx = scenarios.findIndex(s => s.id === editingScenarioId);
      scenarios[idx] = { ...scenarios[idx], ...payload };
      setScenarioReleaseDate(editingScenarioId, releaseDate);
      persistScenariosCache();
      showToast('Обновлено');
    } else {
      const maxPos = scenarios.length > 0 ? Math.max(...scenarios.map(s => s.position)) : 0;
      payload.position = maxPos + 1;
      const [created] = await api('/rest/v1/scenarios', 'POST', payload);
      scenarios.push(created);
      setScenarioReleaseDate(created.id, releaseDate);
      persistScenariosCache();
      showToast('Сценарий добавлен');
    }
    clearScenarioDraft();
    render(); closeScenarioModal(false);
  } catch(e) {
    if (!isNetworkError(e)) { showToast('Ошибка'); console.error(e); }
    else {
      if (editingScenarioId) {
        const idx = scenarios.findIndex(s => s.id === editingScenarioId);
        if (idx !== -1) scenarios[idx] = { ...scenarios[idx], ...payload };
        setScenarioReleaseDate(editingScenarioId, document.getElementById('inp-release-date').value || '');
        enqueueOfflineOp({ type: 'scenario_update', id: editingScenarioId, payload });
        persistScenariosCache();
        showToast('Нет сети: обновление в очереди');
      } else {
        const tempId = -Date.now();
        const tempItem = { id: tempId, created_at: new Date().toISOString(), ...payload };
        scenarios.push(tempItem);
        setScenarioReleaseDate(tempId, document.getElementById('inp-release-date').value || '');
        enqueueOfflineOp({ type: 'scenario_create', tempId, payload });
        persistScenariosCache();
        showToast('Нет сети: сценарий сохранен локально');
      }
      clearScenarioDraft();
      render(); closeScenarioModal(false);
    }
  }
  finally { btn.textContent = editingScenarioId ? 'Обновить' : 'Сохранить'; btn.disabled = false; }
}

function renderCalendar() {
  const title = document.getElementById('calendar-month-title');
  const grid = document.getElementById('calendar-grid');
  if (!title || !grid) return;
  const monthDate = new Date(calendarCurrentMonth.getFullYear(), calendarCurrentMonth.getMonth(), 1);
  title.textContent = monthDate.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });

  const weekDays = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
  const dayNames = weekDays.map(d => `<div class="calendar-weekday">${d}</div>`).join('');

  const firstDay = (monthDate.getDay() + 6) % 7;
  const daysInMonth = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push('<div class="calendar-day empty"></div>');

  const plan = getProjectReleasePlan();
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${monthDate.getFullYear()}-${String(monthDate.getMonth() + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const count = scenarios.filter(s => plan[s.id] === dateStr).length;
    const selected = calendarSelectedDate === dateStr ? 'selected' : '';
    cells.push(`
      <!-- Важно: не делаем "кнопку в кнопке". Иначе маленький "+" может не показываться/не нажиматься -->
      <div class="calendar-day ${selected}" role="button" tabindex="0"
           onclick="selectCalendarDate('${dateStr}')"
           onkeydown="if(event.key==='Enter'||event.key===' '){selectCalendarDate('${dateStr}')}">
        <span class="calendar-day-num">${d}</span>
        ${count > 0 ? `<span class="calendar-dot">${count}</span>` : ''}
        ${count === 0 && isAdmin() ? `<button type="button" class="calendar-add-btn" onclick="openCalendarScenarioPicker(event,'${dateStr}')">+</button>` : ''}
      </div>
    `);
  }

  grid.innerHTML = dayNames + cells.join('');
  renderCalendarPlanList();
}

function openCalendarScenarioPicker(ev, dateStr) {
  // Не даём клику по "+" сработать как "выбрать дату"
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  if (!isAdmin()) return;

  calendarPickDate = dateStr;
  const overlay = document.getElementById('calendar-pick-overlay');
  const title = document.getElementById('calendar-pick-title');
  const list = document.getElementById('calendar-pick-list');
  if (!overlay || !title || !list) return;

  // Заголовок с выбранной датой (чтобы было понятно, куда ставим)
  title.textContent = `Поставить на ${formatDateLabelRu(dateStr)}`;

  // Показываем только сценарии БЕЗ даты (чтобы планировать было быстро и без путаницы)
  const withoutDate = scenarios.filter(s => !getScenarioReleaseDate(s.id));
  const sorted = [...withoutDate].sort((a, b) => {
    const pa = (a.position ?? 0), pb = (b.position ?? 0);
    if (pa !== pb) return pa - pb;
    return String(a.title || '').localeCompare(String(b.title || ''), 'ru');
  });

  // Первый блок: быстро создать новый сценарий сразу на выбранную дату
  const createBlock = `
    <button class="calendar-plan-item" style="text-align:left;cursor:pointer;border-style:dashed"
            onclick="createScenarioForCalendarDate()">
      <div style="font-weight:800;color:var(--text2);">+ Сценарий</div>
    </button>
  `;

  const listBlocks = (sorted.length === 0)
    ? `<div class="calendar-plan-empty">Нет сценариев без даты</div>`
    : sorted.map(s => `
        <button class="calendar-plan-item" style="text-align:left;cursor:pointer" onclick="pickScenarioForCalendarDate(${s.id})">
          <div style="font-weight:700;">${escapeHtml(s.title || 'Без названия')}</div>
          ${s.hero ? `<div style="margin-top:3px;font-size:11px;color:var(--muted);">${escapeHtml(s.hero)}</div>` : `<div style="margin-top:3px;font-size:11px;color:var(--muted);">Без героя</div>`}
        </button>
      `).join('');

  list.innerHTML = createBlock + listBlocks;

  overlay.classList.add('open');
}

function linkify(text) {
  const escaped = escapeHtml(text);
  return escaped.replace(/(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener" style="color:var(--accent);word-break:break-all;text-decoration:underline">$1</a>'
  );
}

function extractFirstUrl(text) {
  if (!text) return null;
  const m = text.match(/https?:\/\/[^\s<]+/i);
  return m ? m[0] : null;
}

function escapeAttr(str) {
  return (str || '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function renderLinkPreview(text) {
  const url = extractFirstUrl(text);
  if (!url) return '';
  const cached = linkPreviewCache[url];
  if (!cached) {
    fetchLinkPreview(url);
    return '';
  }
  if (cached.failed) return '';
  const safeUrl = escapeAttr(url);
  const safeTitle = escapeHtml(cached.title || url);
  const safeDomain = escapeHtml(cached.domain || '');
  const image = cached.image ? `<img class="link-preview-img" src="${escapeAttr(cached.image)}" onerror="this.style.display='none'">` : '';
  return `
    <a class="link-preview" href="${safeUrl}" target="_blank" rel="noopener">
      ${image}
      <div class="link-preview-body">
        <div class="link-preview-title">${safeTitle}</div>
        <div class="link-preview-domain">${safeDomain}</div>
      </div>
    </a>
  `;
}

async function fetchLinkPreview(url) {
  if (!url || linkPreviewCache[url] || linkPreviewLoading.has(url)) return;
  linkPreviewLoading.add(url);
  try {
    const res = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(url)}&meta=true`);
    const json = await res.json();
    if (!json || json.status !== 'success' || !json.data) throw new Error('preview failed');
    const d = json.data;
    let domain = '';
    try { domain = new URL(url).hostname.replace(/^www\./, ''); } catch(e) {}
    linkPreviewCache[url] = {
      title: d.title || d.publisher || url,
      image: (d.image && d.image.url) || '',
      domain: domain
    };
  } catch (e) {
    linkPreviewCache[url] = { failed: true };
  } finally {
    linkPreviewLoading.delete(url);
    render();
  }
}

async function bulkCopyScenarios() {
  const selected = getSelectedScenarios();
  if (selected.length === 0) { showToast('Ничего не выбрано'); return; }
  const text = selected.map(s => {
    const title = (s.title || '').trim();
    const desc = (s.description || '').trim();
    return desc ? `${title}\n${desc}` : title;
  }).filter(Boolean).join('\n\n');
  if (!text) { showToast('Нечего копировать'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showToast(`Скопировано: ${selected.length}`);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(`Скопировано: ${selected.length}`);
  }
}

function updateFastScroll() {
  const track = document.getElementById('fast-scroll-track');
  const thumb = document.getElementById('fast-scroll-thumb');
  if (!track || !thumb) return;

  const doc = document.documentElement;
  const maxScroll = Math.max(0, doc.scrollHeight - window.innerHeight);
  const shouldShow = maxScroll > 500;
  track.style.display = shouldShow ? 'block' : 'none';
  if (!shouldShow) return;

  const trackHeight = track.clientHeight;
  const viewportRatio = window.innerHeight / doc.scrollHeight;
  const thumbHeight = Math.max(28, Math.min(trackHeight, Math.round(trackHeight * viewportRatio)));
  const maxThumbTop = Math.max(0, trackHeight - thumbHeight);
  const scrollRatio = maxScroll > 0 ? (window.scrollY / maxScroll) : 0;
  const thumbTop = Math.round(maxThumbTop * scrollRatio);

  thumb.style.height = `${thumbHeight}px`;
  thumb.style.top = `${thumbTop}px`;
}

function pokeFastScrollActive() {
  const track = document.getElementById('fast-scroll-track');
  if (!track || track.style.display === 'none') return;
  track.classList.add('active');
  clearTimeout(fastScrollFadeTimer);
  if (!fastScrollDragging) {
    fastScrollFadeTimer = setTimeout(() => {
      track.classList.remove('active');
    }, 650);
  }
}

function fastScrollToClientY(clientY) {
  const track = document.getElementById('fast-scroll-track');
  const thumb = document.getElementById('fast-scroll-thumb');
  if (!track || !thumb) return;

  const rect = track.getBoundingClientRect();
  const thumbHeight = thumb.offsetHeight || 28;
  const maxThumbTop = Math.max(1, rect.height - thumbHeight);
  const rawTop = clientY - rect.top - thumbHeight / 2;
  const thumbTop = Math.max(0, Math.min(maxThumbTop, rawTop));
  const ratio = thumbTop / maxThumbTop;

  const doc = document.documentElement;
  const maxScroll = Math.max(0, doc.scrollHeight - window.innerHeight);
  window.scrollTo(0, Math.round(maxScroll * ratio));
}

function initFastScroll() {
  const track = document.getElementById('fast-scroll-track');
  const thumb = document.getElementById('fast-scroll-thumb');
  if (!track || !thumb) return;

  thumb.addEventListener('pointerdown', (e) => {
    fastScrollDragging = true;
    fastScrollPointerId = e.pointerId;
    track.classList.add('dragging');
    track.classList.add('active');
    thumb.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  thumb.addEventListener('pointermove', (e) => {
    if (!fastScrollDragging || e.pointerId !== fastScrollPointerId) return;
    fastScrollToClientY(e.clientY);
    pokeFastScrollActive();
    e.preventDefault();
  });

  thumb.addEventListener('pointerup', (e) => {
    if (e.pointerId !== fastScrollPointerId) return;
    fastScrollDragging = false;
    fastScrollPointerId = null;
    track.classList.remove('dragging');
    thumb.releasePointerCapture(e.pointerId);
    pokeFastScrollActive();
  });

  thumb.addEventListener('pointercancel', () => {
    fastScrollDragging = false;
    fastScrollPointerId = null;
    track.classList.remove('dragging');
    pokeFastScrollActive();
  });

  track.addEventListener('click', (e) => {
    if (e.target === thumb) return;
    fastScrollToClientY(e.clientY);
    pokeFastScrollActive();
  });

  window.addEventListener('scroll', () => { updateFastScroll(); pokeFastScrollActive(); }, { passive: true });
  window.addEventListener('resize', updateFastScroll);
  updateFastScroll();
}

// ── AUTH ──
let currentRole = null; // 'admin' or 'viewer'
let viewerProjectId = null;

async function doLogin() {
  const code = document.getElementById('login-input').value.trim();
  if (!code) return;
  try {
    const res = await api(`/rest/v1/access_codes?code=eq.${encodeURIComponent(code)}&select=*`);
    if (!res || res.length === 0) {
      document.getElementById('login-error').style.display = 'block';
      return;
    }
    const access = res[0];
    currentRole = access.role;
    viewerProjectId = access.project_id;
    sessionStorage.setItem('role', currentRole);
    sessionStorage.setItem('code', code);
    if (viewerProjectId) sessionStorage.setItem('vpid', viewerProjectId);
    applyRole();
    document.getElementById('login-screen').style.display = 'none';
    init();
  } catch(e) {
    document.getElementById('login-error').style.display = 'block';
  }
}

function applyRole() {
  if (currentRole === 'viewer') {
    // Hide all edit controls
    document.getElementById('fab').style.display = 'none';
    document.querySelectorAll('.nav-add-project').forEach(el => el.style.display = 'none');
  }
}

function isAdmin() { return currentRole === 'admin'; }

// Check session on load
(function checkSession() {
  const role = sessionStorage.getItem('role');
  const code = sessionStorage.getItem('code');
  if (role && code) {
    currentRole = role;
    viewerProjectId = sessionStorage.getItem('vpid') ? parseInt(sessionStorage.getItem('vpid')) : null;
    document.getElementById('login-screen').style.display = 'none';
    applyRole();
    init();
  }
})();
