function editScenarioFromCalendar(ev, id) {
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  if (!isAdmin()) return;
  // Календарь — отдельный fullscreen-слой. Если его не закрыть, окно сценария может открыться "под ним".
  closeCalendarModal(true);
  editScenario(id);
}

async function unlinkScenarioFromDate(ev, id) {
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  if (!isAdmin()) return;
  if (!confirm('Отвязать сценарий от даты?')) return;
  await setScenarioReleaseDate(id, '');
  renderCalendar();
  showToast('Отвязано');
}

function renderCalendar() {
  const title = document.getElementById('calendar-month-title');
  const grid = document.getElementById('calendar-grid');
  if (!title || !grid) return;
  const monthDate = new Date(calendarCurrentMonth.getFullYear(), calendarCurrentMonth.getMonth(), 1);
  title.textContent = monthDate.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });

  const weekDays = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
  const dayNames = weekDays.map(d => `<div class="calendar-weekday">${d}</div>`).join('');

  const firstDay = (monthDate.getDay() + 6) % 7;
  const daysInMonth = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push('<div class="calendar-day empty"></div>');

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${monthDate.getFullYear()}-${String(monthDate.getMonth() + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const count = scenarios.filter(s => String(s.release_date || '') === dateStr).length;
    const selected = calendarSelectedDate === dateStr ? 'selected' : '';

    // Плюсик показываем только на выбранной дате, чтобы не нажимался случайно пальцем.
    // Логика:
    // - Будущая дата: плюс только если на дне 0 сценариев
    // - Прошедшая дата: плюс только если отчета дня еще нет
    const isSelectedDay = calendarSelectedDate === dateStr;
    const isPast = isPastDate(dateStr);
    const hasDayReport = isSelectedDay && !!(dayResult && (dayResult.id || dayResult.ig_url || (dayResult.images && dayResult.images.length > 0) || dayResult.note));
    const showPlus = isAdmin() && isSelectedDay && (isPast ? !hasDayReport : (count === 0));

    // Мини-превью опубликованного ролика (если есть отчет дня с ссылкой)
    const dr = (dayResultsByDate && dayResultsByDate[dateStr]) || (dateStr === calendarSelectedDate ? dayResult : null);
    const pubUrl = dr && dr.ig_url ? dr.ig_url : '';
    const cached = pubUrl ? linkPreviewCache[pubUrl] : null;
    const pubImg = cached && !cached.failed && cached.image ? cached.image : '';

    cells.push(`
      <!-- Важно: не делаем "кнопку в кнопке". Иначе маленький "+" может не показываться/не нажиматься -->
      <div class="calendar-day ${selected}" role="button" tabindex="0"
           onclick="selectCalendarDate('${dateStr}')"
           onkeydown="if(event.key==='Enter'||event.key===' '){selectCalendarDate('${dateStr}')}">
        <span class="calendar-day-num">${d}</span>
        ${count > 0 ? `<span class="calendar-dot">${count}</span>` : ''}
        ${pubImg ? `<div class="calendar-pub-bg" style="background-image:url('${escapeAttr(pubImg)}')"></div><div class="calendar-pub-overlay"></div>` : ''}
        ${showPlus ? (isPast
          ? `<button type="button" class="calendar-add-btn" onclick="openDayResultModalForDate(event,'${dateStr}')">+</button>`
          : `<button type="button" class="calendar-add-btn" onclick="openCalendarScenarioPicker(event,'${dateStr}')">+</button>`
        ) : ''}
      </div>
    `);
  }

  grid.innerHTML = dayNames + cells.join('');

  // Убрали верхний дублирующий заголовок "Отчет дня".
  const act = document.getElementById('calendar-day-report-actions');
  if (act) act.innerHTML = '';

  renderCalendarPlanList();
}

function selectCalendarDate(dateStr) {
  calendarSelectedDate = dateStr;
  // Если дата прошедшая — подгружаем отчеты по этой дате
  Promise.all([
    loadCalendarResultsForDate(calendarSelectedDate),
    loadDayResultForDate(calendarSelectedDate)
  ]).finally(() => {
    renderCalendar();
  });
}

function changeCalendarMonth(delta) {
  calendarCurrentMonth = new Date(calendarCurrentMonth.getFullYear(), calendarCurrentMonth.getMonth() + delta, 1);
  loadDayResultsForMonth(calendarCurrentMonth).finally(() => renderCalendar());
}

function openCalendarModal() {
  if (!calendarSelectedDate) {
    const today = new Date();
    calendarSelectedDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  }
  calendarCurrentMonth = new Date(new Date(calendarSelectedDate).getFullYear(), new Date(calendarSelectedDate).getMonth(), 1);
  history.pushState({ modal: 'calendar' }, '');
  document.getElementById('calendar-overlay').classList.add('open');
  loadDayResultsForMonth(calendarCurrentMonth).finally(() => renderCalendar());
}

function closeCalendarModal(fromPopState = false) {
  const overlay = document.getElementById('calendar-overlay');
  if (!fromPopState && overlay && overlay.classList.contains('open')) {
    history.back();
    return;
  }
  document.getElementById('calendar-overlay').classList.remove('open');
}

// ── КАЛЕНДАРЬ: быстрый выбор сценария через "+" ──
function openCalendarScenarioPicker(ev, dateStr) {
  // Не даём клику по "+" сработать как "выбрать дату"
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  if (!isAdmin()) return;

  // отдельный шаг истории, чтобы кнопка "назад" закрывала этот список
  history.pushState({ modal: 'calendar_pick' }, '');

  calendarPickDate = dateStr;
  const overlay = document.getElementById('calendar-pick-overlay');
  const title = document.getElementById('calendar-pick-title');
  const list = document.getElementById('calendar-pick-list');
  if (!overlay || !title || !list) return;

  // Заголовок с выбранной датой (чтобы было понятно, куда ставим)
  title.textContent = `Поставить на ${formatDateLabelRu(dateStr)}`;

  // Показываем только сценарии БЕЗ даты (чтобы планировать было быстро и без путаницы)
  const withoutDate = scenarios.filter(s => !s.release_date);
  const sorted = [...withoutDate].sort((a, b) => {
    const pa = (a.position ?? 0), pb = (b.position ?? 0);
    if (pa !== pb) return pa - pb;
    return String(a.title || '').localeCompare(String(b.title || ''), 'ru');
  });

  // Первый блок: быстро создать новый сценарий сразу на выбранную дату
  const createBlock = `
    <button class="calendar-plan-item" style="text-align:left;cursor:pointer;border-style:dashed"
            onclick="createScenarioForCalendarDate()">
      <div style="font-weight:800;color:var(--text2);">+ Сценарий</div>
    </button>
  `;

  const listBlocks = (sorted.length === 0)
    ? `<div class="calendar-plan-empty">Нет сценариев без даты</div>`
    : sorted.map(s => `
        <button class="calendar-plan-item" style="text-align:left;cursor:pointer" onclick="pickScenarioForCalendarDate(${s.id})">
          <div style="font-weight:700;">${escapeHtml(s.title || 'Без названия')}</div>
          ${s.hero ? `<div style="margin-top:3px;font-size:11px;color:var(--muted);">${escapeHtml(s.hero)}</div>` : `<div style="margin-top:3px;font-size:11px;color:var(--muted);">Без героя</div>`}
        </button>
      `).join('');

  list.innerHTML = createBlock + listBlocks;

  overlay.classList.add('open');
}

function createScenarioForCalendarDate() {
  // Создаём новый сценарий и заранее подставляем дату выбранного дня
  if (!calendarPickDate) return;
  closeCalendarPick();
  openScenarioModal();
  editingScenarioId = null;
  document.getElementById('scenario-modal-title').textContent = 'Новый сценарий';
  document.getElementById('save-btn').textContent = 'Сохранить';
  document.getElementById('inp-release-date').value = calendarPickDate;
  // Подсказка для названия (можно сразу переписать)
  const titleInp = document.getElementById('inp-title');
  if (titleInp && !titleInp.value) titleInp.value = 'Сценарий типа';
  queueScenarioDraftAutosave();
}

function pickScenarioForCalendarDate(scenarioId) {
  if (!calendarPickDate) return;
  setScenarioReleaseDate(scenarioId, calendarPickDate);
  calendarSelectedDate = calendarPickDate;
  closeCalendarPick();
  renderCalendar();
  showToast('Запланировано');
}

function closeCalendarPick(fromPopState = false) {
  const overlay = document.getElementById('calendar-pick-overlay');
  if (!fromPopState && overlay && overlay.classList.contains('open')) {
    history.back();
    return;
  }
  if (overlay) overlay.classList.remove('open');
  calendarPickDate = '';
}

function closeCalendarPickOutside(e) {
  if (e.target === document.getElementById('calendar-pick-overlay')) closeCalendarPick(false);
}

// ── ОТЧЕТ (прошедшие даты) ──
function openDayResultModalForDate(ev, dateStr) {
  // Плюсик на прошедшей дате открывает отчет дня
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  if (!dateStr) return;
  calendarSelectedDate = dateStr;
  Promise.all([
    loadCalendarResultsForDate(calendarSelectedDate),
    loadDayResultForDate(calendarSelectedDate)
  ]).finally(() => {
    renderCalendar();
    openDayResultModal(ev);
  });
}

function openDayResultModal(ev) {
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  if (!calendarSelectedDate || !isPastDate(calendarSelectedDate)) {
    showToast('Отчет доступен для прошедших дат');
    return;
  }

  history.pushState({ modal: 'day_result' }, '');

  const r = dayResult || { ig_url: '', images: [], note: '' };
  pendingDayResultImages = r.images ? [...r.images] : [];
  document.getElementById('day-result-title').textContent = `Отчет дня · ${formatDateLabelRu(calendarSelectedDate)}`;
  document.getElementById('day-result-ig-url').value = r.ig_url || '';
  document.getElementById('day-result-note').value = r.note || '';
  updateDayResultIgPreview();
  renderDayResultThumbs();
  const overlay = document.getElementById('day-result-overlay');
  if (overlay) overlay.classList.add('open');
}

function closeDayResultModal(fromPopState = false) {
  const overlay = document.getElementById('day-result-overlay');
  if (!fromPopState && overlay && overlay.classList.contains('open')) {
    history.back();
    return;
  }
  if (overlay) overlay.classList.remove('open');
  pendingDayResultImages = [];
  const prev = document.getElementById('day-result-ig-preview');
  if (prev) prev.innerHTML = '';
  const q = document.getElementById('day-result-upload-queue');
  if (q) { q.innerHTML = ''; q.style.display = 'none'; }
}

function closeDayResultModalOutside(e) {
  if (e.target === document.getElementById('day-result-overlay')) closeDayResultModal(false);
}

function updateDayResultIgPreview() {
  const input = document.getElementById('day-result-ig-url');
  const box = document.getElementById('day-result-ig-preview');
  if (!input || !box) return;
  const url = (input.value || '').trim();
  if (!url) { box.innerHTML = ''; return; }
  box.innerHTML = renderLinkPreviewOrLink(url);
}

function renderDayResultThumbs() {
  const el = document.getElementById('day-result-thumbs');
  if (!el) return;
  if (!pendingDayResultImages || pendingDayResultImages.length === 0) {
    el.innerHTML = `<div style="color:var(--muted);font-size:12px">Скриншотов пока нет</div>`;
    return;
  }
  el.innerHTML = pendingDayResultImages.map((url, idx) => `
    <div style="position:relative;flex-shrink:0">
      <img src="${escapeAttr(url)}" style="width:72px;height:72px;border-radius:10px;object-fit:cover;border:1.5px solid var(--border)" onclick="openLightbox('${escapeAttr(url)}')">
      <button onclick="removeDayResultImage(event,${idx})" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:2px solid #fff;background:#c0392b;color:#fff;cursor:pointer;line-height:1">×</button>
    </div>
  `).join('');
}

function removeDayResultImage(ev, idx) {
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  pendingDayResultImages.splice(idx, 1);
  renderDayResultThumbs();
}

async function handleDayResultFiles(e) {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if (files.length === 0) return;
  const queueEl = document.getElementById('day-result-upload-queue');
  if (queueEl) { queueEl.style.display = 'flex'; }

  for (const file of files) {
    const maxBytes = 50 * 1024 * 1024;
    if (file.size > maxBytes) {
      showToast('Файл больше 50MB — на Free не загрузится');
      continue;
    }
    const localId = `${Date.now()}_${Math.random().toString(36).slice(2)}`;
    if (queueEl) queueEl.insertAdjacentHTML('beforeend', buildUploadRowHtml(localId, file.name));
    try {
      const url = await uploadFileToBucketWithProgress(file, BUCKET_MEDIA, (pct) => {
        const bar = document.getElementById(`upload-bar-${localId}`);
        const hint = document.getElementById(`upload-hint-${localId}`);
        if (bar) bar.style.width = `${pct}%`;
        if (hint) hint.textContent = `Загрузка: ${pct}%`;
      });
      pendingDayResultImages.push(url);
      renderDayResultThumbs();
      const hint = document.getElementById(`upload-hint-${localId}`);
      if (hint) hint.textContent = 'Готово';
    } catch (err) {
      const hint = document.getElementById(`upload-hint-${localId}`);
      if (hint) hint.textContent = 'Ошибка';
      showToast(`Ошибка загрузки: ${(err && err.message ? err.message : 'неизвестно')}`.slice(0, 180));
    }
  }
}

async function saveDayResult() {
  if (!currentProjectId || !calendarSelectedDate) return;
  if (!isPastDate(calendarSelectedDate)) { showToast('Только для прошедших дат'); return; }
  const igUrl = (document.getElementById('day-result-ig-url').value || '').trim();
  const note = (document.getElementById('day-result-note').value || '').trim();
  const payload = {
    project_id: currentProjectId,
    date: calendarSelectedDate,
    ig_url: igUrl || null,
    note: note || null,

function closeResultModalOutside(e) {

function renderResultThumbs() {

function removeResultImage(ev, idx) {

async function handleResultFiles(e) {

async function loadMediaLibrary() {
  // Берём список медиа из Supabase (а не из localStorage)
  try {
    if (!currentProjectId) { mediaLibrary = []; renderMediaList(); return; }
    mediaLibrary = await api(`/rest/v1/media_items?select=*&project_id=eq.${currentProjectId}&order=created_at.desc`);
  } catch (e) {
    mediaLibrary = [];
    showToast('Не удалось загрузить медиатеку');

  renderMediaList();
}

function setMediaFilter(next) {
  mediaFilter = next;
  renderMediaList();
}

function getMediaSearchQuery() {
  const input = document.getElementById('media-search');
  return input ? input.value.trim().toLowerCase() : '';
}

function renderMediaList() {
  const el = document.getElementById('media-list');
  if (!el) return;
  const q = getMediaSearchQuery();
  const list = (mediaLibrary || []).slice().sort((a, b) => {
    const ta = a.created_at ? new Date(a.created_at).getTime() : (a.createdAt || 0);
    const tb = b.created_at ? new Date(b.created_at).getTime() : (b.createdAt || 0);
    return tb - ta;
  });

  const byStatus = list.filter(x => {
    const approved = !!x.approved;
    if (mediaFilter === 'approved') return approved;
    if (mediaFilter === 'pending') return !approved;
    return true;
  });

  const filtered = q
    ? byStatus.filter(x =>
        (x.name || '').toLowerCase().includes(q) ||
        (x.tags || '').toLowerCase().includes(q) ||
        (x.kind || '').toLowerCase().includes(q)
      )
    : byStatus;

  if (filtered.length === 0) {
    el.innerHTML = `<div class="calendar-plan-empty">Пока пусто.</div>`;
    return;
  }

  const filterRow = `
    <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
      <button class="media-action-btn" style="${mediaFilter==='all'?'border-color:var(--accent);color:var(--accent);background:#fdf3ec':''}" onclick="setMediaFilter('all')">Все</button>
      <button class="media-action-btn" style="${mediaFilter==='pending'?'border-color:var(--accent);color:var(--accent);background:#fdf3ec':''}" onclick="setMediaFilter('pending')">На проверке</button>
      <button class="media-action-btn" style="${mediaFilter==='approved'?'border-color:var(--accent);color:var(--accent);background:#fdf3ec':''}" onclick="setMediaFilter('approved')">Approved</button>
    </div>
  `;

  el.innerHTML = filterRow + filtered.map(item => {
    const type = item.type || '';
    const isVideo = type.startsWith('video/');
    const thumb = isVideo
      ? `<div class="media-thumb"><video src="${escapeAttr(item.url)}" muted playsinline></video></div>`
      : `<div class="media-thumb"><img src="${escapeAttr(item.url)}" onerror="this.parentNode.textContent='IMG'"></div>`;
    const tags = item.tags ? escapeHtml(item.tags) : 'Без тегов';
    const name = escapeHtml(item.name || 'Без названия');
    const kind = item.kind ? escapeHtml(item.kind) : 'без типа';
    const approved = !!item.approved;
    const statusLine = approved
      ? `<span style="display:inline-flex;align-items:center;gap:6px;color:#5a9e5a;font-weight:800;font-size:11px;">✅ approved</span>`
      : `<span style="display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:800;font-size:11px;">⏳ на проверке</span>`;
    return `
      <div class="media-item">
        ${thumb}
        <div class="media-meta">
          <div class="media-name">${name}</div>
          <div class="media-tags">${statusLine} · ${kind} · ${tags}</div>
        </div>
        <div class="media-actions">
          <button class="media-action-btn" onclick="useMediaItem('${escapeAttr(item.id)}')">В сценарий</button>
          <button class="media-action-btn" onclick="editMediaTags('${escapeAttr(item.id)}')">Теги</button>
          <button class="media-action-btn" onclick="editMediaKind('${escapeAttr(item.id)}')">Тип</button>
          ${isAdmin()
            ? `<button class="media-action-btn" onclick="approveMediaItem('${escapeAttr(item.id)}')" style="${approved?'opacity:0.5;pointer-events:none;':''}">✅</button>
               <button class="media-action-btn danger" onclick="deleteMediaItem('${escapeAttr(item.id)}')">Удалить</button>`
            : ``}
        </div>
      </div>
    `;
  }).join('');
}

function buildUploadRowHtml(localId, fileName) {
  const safeName = escapeHtml(fileName || 'Файл');
  return `
    <div class="upload-row" id="upload-row-${localId}">
      <div class="upload-title">${safeName}</div>
      <div class="upload-progress"><div id="upload-bar-${localId}"></div></div>
      <div class="upload-hint" id="upload-hint-${localId}">Загрузка: 0%</div>
    </div>
  `;
}

async function handleMediaFiles(e) {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if (files.length === 0) return;

  const queueEl = document.getElementById('media-upload-queue');
  if (queueEl) { queueEl.style.display = 'flex'; }

  for (const file of files) {
    // Защита: на Free плане максимум 50MB на файл
    const maxBytes = 50 * 1024 * 1024;
    if (file.size > maxBytes) {
      showToast('Файл больше 50MB — на Free не загрузится');
      continue;
    }

    const localId = `${Date.now()}_${Math.random().toString(36).slice(2)}`;
    if (queueEl) queueEl.insertAdjacentHTML('beforeend', buildUploadRowHtml(localId, file.name));

    try {
      const url = await uploadFileToBucketWithProgress(file, BUCKET_MEDIA, (pct) => {
        const bar = document.getElementById(`upload-bar-${localId}`);
        const hint = document.getElementById(`upload-hint-${localId}`);
        if (bar) bar.style.width = `${pct}%`;
        if (hint) hint.textContent = `Загрузка: ${pct}%`;
      });

      // Сохраняем карточку медиа в Supabase (чтобы было видно на всех устройствах)
      const payload = {
        project_id: currentProjectId,
        url,
        type: file.type || 'application/octet-stream',
        name: (file.name || 'Медиа').replace(/\.[^/.]+$/, ''),
        tags: '',
        kind: '',
        approved: false
      };
      const created = await api('/rest/v1/media_items', 'POST', payload);
      // Supabase возвращает массив
      if (created && created[0]) mediaLibrary.unshift(created[0]);
      else await loadMediaLibrary();
      renderMediaList();

      const hint = document.getElementById(`upload-hint-${localId}`);
      if (hint) hint.textContent = 'Готово';
      showToast('Загружено');
    } catch (err) {
      const hint = document.getElementById(`upload-hint-${localId}`);
      if (hint) hint.textContent = 'Ошибка загрузки';
      showToast('Ошибка загрузки');
      console.error(err);
    }
  }
}

function useMediaItem(id) {
  const item = (mediaLibrary || []).find(x => x.id === id);
  if (!item) return;

  // Если открыт сценарий — вставляем ссылку в описание (самый простой вариант)
  const scenarioOverlay = document.getElementById('scenario-overlay');
  const isScenarioOpen = scenarioOverlay && scenarioOverlay.classList.contains('open');
  if (isScenarioOpen) {
    const descEl = document.getElementById('inp-desc');
    const preview = document.getElementById('desc-preview');
    const before = descEl.value || '';
    const sep = before.trim().length > 0 ? '\n' : '';
    descEl.value = `${before}${sep}${item.url}`;
    if (preview) {
      preview.textContent = descEl.value || 'Нажми чтобы добавить описание...';
      preview.style.color = descEl.value ? 'var(--text)' : 'var(--muted)';
    }
    queueScenarioDraftAutosave();
    showToast('Добавлено в сценарий');
    closeMediaModal();
    return;
  }

  // Если сценарий не открыт — копируем ссылку
  navigator.clipboard.writeText(item.url).then(() => showToast('Ссылка скопирована')).catch(() => showToast('Не удалось скопировать'));
}

function deleteMediaItem(id) {
  if (!confirm('Удалить из медиатеки?')) return;
  (async () => {
    try {
      await api(`/rest/v1/media_items?id=eq.${encodeURIComponent(id)}`, 'DELETE');
      mediaLibrary = (mediaLibrary || []).filter(x => String(x.id) !== String(id));
      renderMediaList();
      showToast('Удалено');
    } catch (e) {
      showToast('Не удалось удалить');
    }
  })();
}

function editMediaTags(id) {
  // Простое редактирование тегов: через запятую
  const item = (mediaLibrary || []).find(x => String(x.id) === String(id));
  const current = item && item.tags ? item.tags : '';
  const next = prompt('Теги (через запятую):', current);
  if (next === null) return; // отмена

  // Немного чистим: убираем двойные пробелы
  const cleaned = String(next)
    .split(',')
    .map(s => s.trim())
    .filter(Boolean)
    .join(', ');

  (async () => {
    try {
      await api(`/rest/v1/media_items?id=eq.${encodeURIComponent(id)}`, 'PATCH', { tags: cleaned });
      if (item) item.tags = cleaned;
      renderMediaList();
      showToast('Теги сохранены');
    } catch (e) {
      showToast('Не удалось сохранить теги');
    }
  })();
}

function editMediaKind(id) {
  const item = (mediaLibrary || []).find(x => String(x.id) === String(id));
  const current = item && item.kind ? item.kind : '';
  const next = prompt('Тип материала (например: reels, stories, пост):', current);

  const cleaned = String(next).trim();
  (async () => {

function approveMediaItem(id) {

function linkify(text) {
  const escaped = escapeHtml(text);
  return escaped.replace(/(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener" style="color:var(--accent);word-break:break-all;text-decoration:underline">$1</a>'
  );
}

function extractFirstUrl(text) {
  if (!text) return null;
  const m = text.match(/https?:\/\/[^\s<]+/i);
  return m ? m[0] : null;
}

function escapeAttr(str) {
  return (str || '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function renderLinkPreview(text) {
  const url = extractFirstUrl(text);
  if (!url) return '';
  const cached = linkPreviewCache[url];
  if (!cached) {
    fetchLinkPreview(url);
    return '';
  }
  if (cached.failed) return '';
  const safeUrl = escapeAttr(url);
  const safeTitle = escapeHtml(cached.title || url);
  const safeDomain = escapeHtml(cached.domain || '');
  const image = cached.image ? `<img class="link-preview-img" src="${escapeAttr(cached.image)}" onerror="this.style.display='none'">` : '';
  return `
    <a class="link-preview" href="${safeUrl}" target="_blank" rel="noopener">
      ${image}
      <div class="link-preview-body">
        <div class="link-preview-title">${safeTitle}</div>
        <div class="link-preview-domain">${safeDomain}</div>
      </div>
    </a>
  `;
}

// Предпросмотр ссылки: если карточка ещё не готова — показываем просто ссылку.
function renderLinkPreviewOrLink(url) {
  const safeUrl = escapeAttr(url || '');
  if (!url) return '';
  const preview = renderLinkPreview(url);
  if (preview) return preview;
  return `<a href="${safeUrl}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;word-break:break-all">${escapeHtml(url)}</a>`;
}

async function fetchLinkPreview(url) {
  if (!url || linkPreviewCache[url] || linkPreviewLoading.has(url)) return;
  linkPreviewLoading.add(url);
  try {
    const res = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(url)}&meta=true`);
    const json = await res.json();
    if (!json || json.status !== 'success' || !json.data) throw new Error('preview failed');
    const d = json.data;
    let domain = '';
    try { domain = new URL(url).hostname.replace(/^www\./, ''); } catch(e) {}
    linkPreviewCache[url] = {
      title: d.title || d.publisher || url,
      image: (d.image && d.image.url) || '',
      domain: domain
    };
  } catch (e) {
    linkPreviewCache[url] = { failed: true };
  } finally {
    linkPreviewLoading.delete(url);
    render();
    // Если открыт календарь — перерисуем сетку дней, чтобы превью появилось без клика
    const co = document.getElementById('calendar-overlay');
    if (co && co.classList.contains('open')) renderCalendar();
    // Если открыт отчет — обновим предпросмотр ссылки там тоже
    const ro = document.getElementById('result-overlay');
    if (ro && ro.classList.contains('open')) updateResultIgPreview();
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');

function toggleScenarioSelection(id) {

async function bulkSetStatus(nextStatus) {
  const selected = getSelectedScenarios();
  if (selected.length === 0) { showToast('Ничего не выбрано'); return; }
  try {
    await Promise.all(selected.map(s => api(`/rest/v1/scenarios?id=eq.${s.id}`, 'PATCH', { status: nextStatus })));
    scenarios = scenarios.map(s => selectedScenarioIds.has(s.id) ? { ...s, status: nextStatus } : s);
    persistScenariosCache();
    selectedScenarioIds.clear();
    selectionMode = false;
    render();
    showToast('Статус обновлен');
  } catch (e) {
    showToast('Ошибка');
  }
}

async function bulkDeleteScenarios() {
  const selected = getSelectedScenarios();
  if (selected.length === 0) { showToast('Ничего не выбрано'); return; }
  if (!confirm(`Удалить сценарии: ${selected.length}?`)) return;
  try {
    await Promise.all(selected.map(s => api(`/rest/v1/scenarios?id=eq.${s.id}`, 'DELETE')));
    scenarios = scenarios.filter(s => !selectedScenarioIds.has(s.id));
    persistScenariosCache();
    selectedScenarioIds.clear();
    selectionMode = false;
    render();
    showToast('Удалено');
  } catch (e) {
    showToast('Ошибка');
  }
}

async function bulkCopyScenarios() {
  const selected = getSelectedScenarios();
  if (selected.length === 0) { showToast('Ничего не выбрано'); return; }
  const text = selected.map(s => {
    const title = (s.title || '').trim();
    const desc = (s.description || '').trim();
    return desc ? `${title}\n${desc}` : title;
  }).filter(Boolean).join('\n\n');
  if (!text) { showToast('Нечего копировать'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showToast(`Скопировано: ${selected.length}`);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(`Скопировано: ${selected.length}`);
  }
}

function updateFastScroll() {
  const track = document.getElementById('fast-scroll-track');
  const thumb = document.getElementById('fast-scroll-thumb');
  if (!track || !thumb) return;

  const doc = document.documentElement;
  const maxScroll = Math.max(0, doc.scrollHeight - window.innerHeight);
  const shouldShow = maxScroll > 500;
  track.style.display = shouldShow ? 'block' : 'none';
  if (!shouldShow) return;

  const trackHeight = track.clientHeight;
  const viewportRatio = window.innerHeight / doc.scrollHeight;
  const thumbHeight = Math.max(28, Math.min(trackHeight, Math.round(trackHeight * viewportRatio)));
  const maxThumbTop = Math.max(0, trackHeight - thumbHeight);
  const scrollRatio = maxScroll > 0 ? (window.scrollY / maxScroll) : 0;
  const thumbTop = Math.round(maxThumbTop * scrollRatio);

  thumb.style.height = `${thumbHeight}px`;
  thumb.style.top = `${thumbTop}px`;
}

function pokeFastScrollActive() {
  const track = document.getElementById('fast-scroll-track');
  if (!track || track.style.display === 'none') return;
  track.classList.add('active');
  clearTimeout(fastScrollFadeTimer);
  if (!fastScrollDragging) {
    fastScrollFadeTimer = setTimeout(() => {
      track.classList.remove('active');
    }, 650);
  }
}

function fastScrollToClientY(clientY) {
  const track = document.getElementById('fast-scroll-track');
  const thumb = document.getElementById('fast-scroll-thumb');
  if (!track || !thumb) return;

  const rect = track.getBoundingClientRect();
  const thumbHeight = thumb.offsetHeight || 28;
  const maxThumbTop = Math.max(1, rect.height - thumbHeight);
  const rawTop = clientY - rect.top - thumbHeight / 2;
  const thumbTop = Math.max(0, Math.min(maxThumbTop, rawTop));
  const ratio = thumbTop / maxThumbTop;

  const doc = document.documentElement;
  const maxScroll = Math.max(0, doc.scrollHeight - window.innerHeight);
  window.scrollTo(0, Math.round(maxScroll * ratio));
}

function initFastScroll() {
  const track = document.getElementById('fast-scroll-track');
  const thumb = document.getElementById('fast-scroll-thumb');
  if (!track || !thumb) return;

  thumb.addEventListener('pointerdown', (e) => {
    fastScrollDragging = true;
    fastScrollPointerId = e.pointerId;
    track.classList.add('dragging');
    track.classList.add('active');
    thumb.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  thumb.addEventListener('pointermove', (e) => {
    if (!fastScrollDragging || e.pointerId !== fastScrollPointerId) return;
    fastScrollToClientY(e.clientY);
    pokeFastScrollActive();
    e.preventDefault();
  });

  thumb.addEventListener('pointerup', (e) => {
    if (e.pointerId !== fastScrollPointerId) return;
    fastScrollDragging = false;
    fastScrollPointerId = null;
    track.classList.remove('dragging');
    thumb.releasePointerCapture(e.pointerId);
    pokeFastScrollActive();
  });

  thumb.addEventListener('pointercancel', () => {
    fastScrollDragging = false;
    fastScrollPointerId = null;
    track.classList.remove('dragging');
    pokeFastScrollActive();
  });

  track.addEventListener('click', (e) => {
    if (e.target === thumb) return;
    fastScrollToClientY(e.clientY);
    pokeFastScrollActive();
  });

  window.addEventListener('scroll', () => { updateFastScroll(); pokeFastScrollActive(); }, { passive: true });
  window.addEventListener('resize', updateFastScroll);
  updateFastScroll();
}

// ── AUTH ──
let currentRole = null; // 'admin' or 'viewer'
let viewerProjectId = null;

async function doLogin() {
  const code = document.getElementById('login-input').value.trim();
  if (!code) return;
  try {
    const res = await api(`/rest/v1/access_codes?code=eq.${encodeURIComponent(code)}&select=*`);
    if (!res || res.length === 0) {
      document.getElementById('login-error').style.display = 'block';
      return;
    }
    const access = res[0];
    currentRole = access.role;
    viewerProjectId = access.project_id;
    sessionStorage.setItem('role', currentRole);
    sessionStorage.setItem('code', code);
    if (viewerProjectId) sessionStorage.setItem('vpid', viewerProjectId);
    applyRole();
    document.getElementById('login-screen').style.display = 'none';
    init();
  } catch(e) {
    document.getElementById('login-error').style.display = 'block';
  }
}

function applyRole() {
  if (currentRole === 'viewer') {
    // Hide all edit controls
    document.getElementById('fab').style.display = 'none';
    document.querySelectorAll('.nav-add-project').forEach(el => el.style.display = 'none');
  }
}

function isAdmin() { return currentRole === 'admin'; }

// Check session on load
(function checkSession() {
  const role = sessionStorage.getItem('role');
  const code = sessionStorage.getItem('code');
  if (role && code) {
    currentRole = role;
    viewerProjectId = sessionStorage.getItem('vpid') ? parseInt(sessionStorage.getItem('vpid')) : null;
    document.getElementById('login-screen').style.display = 'none';
    applyRole();
    init();
  }
})();
