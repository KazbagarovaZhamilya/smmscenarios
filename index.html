<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Сценарии</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f0e8;
    --surface: #fefcf7;
    --surface2: #f0ebe0;
    --border: #e2d9c8;
    --accent: #b5622a;
    --accent2: #d4804a;
    --text: #1e1810;
    --text2: #6b5d4f;
    --muted: #a0917f;
    --radius: 16px;
    --shadow: 0 1px 4px rgba(0,0,0,0.08), 0 2px 12px rgba(0,0,0,0.04);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding-bottom: 90px;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px 8px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 8px rgba(0,0,0,0.06);
  }

  .header-line1 {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 7px;
  }
  .header-line2 {
    display: flex;
    align-items: center;
    gap: 7px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .header-line2::-webkit-scrollbar { display: none; }

  .project-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    color: var(--text);
    font-size: 15.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }

  /* counter as pill — same row as filters */
  .counter-pill {
    font-size: 11px;
    font-weight: 700;
    color: var(--text2);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* hero filter pills — same row */
  .hero-pill {
    flex-shrink: 0;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .hero-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── LIST ── */
  .list { padding: 12px 12px 0; display: flex; flex-direction: column; gap: 10px; }

  .section-label {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1.2px;
    padding: 8px 2px 2px;
    display: flex; align-items: center; gap: 6px;
  }

  /* ── CARDS ── */
  .scenario-card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .scenario-card.status-draft { background: #fafaf8; border-color: #ddd; opacity: 0.82; }
  .scenario-card.status-done { background: #f8faf8; border-color: #cddccd; opacity: 0.65; }

  .status-bar { height: 3px; }
  .status-active .status-bar { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .status-draft .status-bar { background: #c4c9d0; }
  .status-done .status-bar { background: #7db87d; }

  .card-main { display: flex; align-items: flex-start; gap: 10px; padding: 12px 12px 10px; }

  .num {
    font-family: 'Playfair Display', serif; font-size: 20px;
    color: var(--accent); min-width: 26px; text-align: center;
    line-height: 1.1; padding-top: 2px; flex-shrink: 0;
  }
  .status-draft .num { color: #aaa; }
  .status-done .num { color: #7db87d; }

  .card-content { flex: 1; min-width: 0; }

  .card-hero {
    font-size: 10px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.8px;
    margin-bottom: 3px; display: flex; align-items: center; gap: 4px;
  }
  .status-draft .card-hero { color: var(--muted); }
  .status-done .card-hero { color: #7db87d; }

  .card-title { font-weight: 600; font-size: 15px; color: var(--text); line-height: 1.4; }
  .status-draft .card-title { color: var(--text2); }
  .status-done .card-title { text-decoration: line-through; color: var(--muted); }

  .card-desc {
    font-size: 13px; color: var(--text2); margin-top: 4px; line-height: 1.5;
    white-space: pre-wrap; /* preserve line breaks */
  }
  .link-preview {
    margin-top: 6px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    display: flex;
    align-items: stretch;
    text-decoration: none;
    color: inherit;
  }
  .link-preview-img {
    width: 84px;
    height: 84px;
    flex-shrink: 0;
    object-fit: cover;
    display: block;
    background: var(--surface2);
  }
  .link-preview-body {
    padding: 7px 8px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .link-preview-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    line-clamp: 2;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-decoration: none;
  }
  .link-preview-domain {
    margin-top: 2px;
    font-size: 10px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* photo strip */
  .card-photos {
    display: flex; gap: 6px;
    overflow-x: auto; scrollbar-width: none;
    padding: 0 12px 10px;
  }
  .card-photos::-webkit-scrollbar { display: none; }

  .card-photo {
    width: 72px; height: 72px; border-radius: 10px;
    object-fit: cover; flex-shrink: 0;
    border: 1px solid var(--border); cursor: pointer;
    transition: opacity 0.15s;
  }
  .card-photo:active { opacity: 0.8; }

  .status-btn {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px solid var(--border); background: var(--surface2);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s; margin-top: 2px;
  }
  .status-active .status-btn { border-color: var(--accent); background: #fdf3ec; }
  .status-draft .status-btn { border-color: #ccc; background: #f5f5f5; }
  .status-done .status-btn { border-color: #7db87d; background: #edf5ed; }

  .card-footer { display: none; }

  .edit-circle {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px solid var(--border); background: var(--surface2);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s; margin-top: 6px; color: var(--muted);
  }
  .edit-circle:hover { border-color: var(--accent); color: var(--accent); background: #fdf3ec; }

  .card-date { font-size: 10px; color: var(--muted); margin-top: 1px; }

  .multi-select-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    margin-top: 3px;
  }
  .multi-select-btn.selected {
    border-color: var(--accent);
    background: #fdf3ec;
    color: var(--accent);
  }

  /* ── FAB ── */
  .fab {
    position: fixed; bottom: 70px; right: 14px;
    width: 50px; height: 50px; border-radius: 50%;
    background: var(--accent); border: none; color: #fff;
    cursor: pointer; box-shadow: 0 4px 20px rgba(181,98,42,0.35);
    display: flex; align-items: center; justify-content: center;
    z-index: 150; transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.92); }

  /* ── FAST SCROLL ── */
  .fast-scroll-track {
    position: fixed;
    right: 4px;
    top: 84px;
    bottom: 76px;
    width: 20px;
    z-index: 140;
    display: none;
    touch-action: none;
  }
  .fast-scroll-thumb {
    position: absolute;
    right: 3px;
    width: 14px;
    border-radius: 10px;
    background: rgba(181, 98, 42, 0.75);
    box-shadow: 0 1px 4px rgba(0,0,0,0.18);
    min-height: 28px;
    opacity: 0.14;
    transition: background 0.15s, opacity 0.2s;
  }
  .fast-scroll-track.active .fast-scroll-thumb { opacity: 0.78; }
  .fast-scroll-track.dragging .fast-scroll-thumb {
    background: rgba(181, 98, 42, 0.95);
    opacity: 0.95;
  }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1.5px solid var(--border);
    display: flex; align-items: stretch; z-index: 200;
    box-shadow: 0 -2px 16px rgba(0,0,0,0.07);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-projects { display: flex; flex: 1; overflow-x: auto; scrollbar-width: none; }
  .nav-projects::-webkit-scrollbar { display: none; }

  .nav-item {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px 14px; cursor: pointer; border: none; background: transparent;
    font-family: 'Inter', sans-serif; gap: 4px; min-width: 70px;
    flex-shrink: 0; transition: background 0.15s; position: relative;
  }
  .nav-item.active::after {
    content: ''; position: absolute; top: 0; left: 12px; right: 12px;
    height: 2.5px; border-radius: 0 0 3px 3px; background: var(--nav-color, var(--accent));
  }
  .nav-dot { width: 8px; height: 8px; border-radius: 50%; transition: transform 0.15s; }
  .nav-item.active .nav-dot { transform: scale(1.3); }
  .nav-label {
    font-size: 10px; font-weight: 600; color: var(--muted);
    max-width: 68px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; text-align: center;
  }
  .nav-item.active .nav-label { color: var(--text); }

  .nav-actions {
    display: flex;
    flex-shrink: 0;
    border-left: 1px solid var(--border);
  }
  .nav-add-project, .nav-calendar {
    width: 46px; border: none;
    background: transparent; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--muted); flex-shrink: 0; transition: color 0.2s;
  }
  .nav-add-project:hover, .nav-calendar:hover { color: var(--accent); }

  .calendar-month {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .calendar-month-title {
    font-family: 'Playfair Display', serif;
    color: var(--accent);
    font-size: 18px;
    text-transform: capitalize;
  }
  .calendar-nav-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    /* Чтобы все клетки календаря были одинаковой высоты */
    grid-auto-rows: 46px;
  }
  .calendar-weekday {
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
  }
  .calendar-day {
    border: 1.5px solid var(--border);
    border-radius: 10px;
    min-height: 46px;
    height: 46px; /* фиксируем высоту, чтобы 1/2/3 не становились огромными */
    background: var(--surface);
    padding: 4px 3px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative; /* нужно для "плюсика" в правом верхнем углу */
    font-family: inherit;
  }
  .calendar-day.empty {
    border-color: transparent;
    background: transparent;
    cursor: default;
    height: 46px;
  }
  .calendar-day-num {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
  }
  .calendar-day.selected {
    border-color: var(--accent);
    background: #fdf3ec;
  }

  /* Мини-превью опубликованного ролика в клетке календаря */
  .calendar-pub-bg {
    position: absolute;
    inset: 3px;
    border-radius: 8px;
    background-size: cover;
    background-position: center;
    filter: saturate(1.05) contrast(1.02);
    opacity: 0.92;
    pointer-events: none;
  }
  .calendar-pub-overlay {
    position: absolute;
    inset: 3px;
    border-radius: 8px;
    background: linear-gradient(180deg, rgba(254,252,247,0.95) 0%, rgba(254,252,247,0.35) 55%, rgba(254,252,247,0.05) 100%);
    pointer-events: none;
  }
  .calendar-day-num {
    position: relative;
    z-index: 1;
  }
  .calendar-dot, .calendar-add-btn {
    z-index: 2;
  }

  /* Серый "плюсик" на пустых датах (для быстрого планирования) */
  .calendar-add-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 18px;
    height: 18px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.02);
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .calendar-add-btn:hover {
    border-color: var(--muted);
  }
  .calendar-dot {
    margin-top: 4px;
    min-width: 14px;
    height: 14px;
    border-radius: 9px;
    padding: 0 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
  }
  .calendar-plan-list {
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .calendar-plan-item {
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text);
    line-height: 1.4;
  }
  .calendar-plan-empty {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 10px 0;
  }

  /* ── FULLSCREEN MODAL ── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: var(--bg); z-index: 300; flex-direction: column;
  }
  .overlay.open { display: flex; }

  .modal-header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .modal-back {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: var(--surface2); cursor: pointer; display: flex;
    align-items: center; justify-content: center; color: var(--text2);
    flex-shrink: 0;
  }
  .modal-header-title {
    font-family: 'Playfair Display', serif; color: var(--accent); font-size: 18px; flex: 1;
  }

  .modal-body {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 14px;
  }

  .field label {
    display: block; font-size: 11px; font-weight: 700; color: var(--muted);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.6px;
  }

  .field input, .field textarea {
    width: 100%; background: var(--surface);
    border: 1.5px solid var(--border); border-radius: 12px;
    padding: 12px 14px; color: var(--text); font-family: 'Inter', sans-serif;
    font-size: 15px; outline: none; transition: border-color 0.2s; -webkit-appearance: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 160px; }

  .hero-quick { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 8px; }
  .hero-quick-btn {
    padding: 5px 13px; border-radius: 20px; border: 1.5px solid var(--border);
    background: var(--surface2); color: var(--text2); font-size: 12px; font-weight: 600;
    font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.18s;
  }
  .hero-quick-btn.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

  .status-select { display: flex; gap: 8px; }
  .status-opt {
    flex: 1; padding: 9px 4px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--surface2); color: var(--text2); font-size: 11px; font-weight: 600;
    font-family: 'Inter', sans-serif; cursor: pointer; text-align: center;
    transition: all 0.18s; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .status-opt.selected { border-color: var(--accent); background: #fdf3ec; color: var(--accent); }
  .status-opt.selected.draft { border-color: #9ca3af; background: #f3f4f6; color: #6b7280; }
  .status-opt.selected.done { border-color: #7db87d; background: #edf5ed; color: #5a9e5a; }

  /* multi photo upload */
  .photos-upload-strip {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px;
  }
  .photos-upload-strip::-webkit-scrollbar { display: none; }

  .photo-thumb-wrap {
    position: relative; flex-shrink: 0;
  }
  .photo-thumb-wrap img {
    width: 72px; height: 72px; border-radius: 10px; object-fit: cover;
    border: 1.5px solid var(--border); display: block;
  }
  .photo-remove {
    position: absolute; top: -6px; right: -6px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #c0392b; border: 2px solid #fff; color: #fff;
    font-size: 12px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .add-photo-btn {
    width: 72px; height: 72px; border-radius: 10px;
    border: 2px dashed var(--border); background: var(--surface2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; color: var(--muted); font-size: 10px; font-weight: 600;
    gap: 4px; flex-shrink: 0; transition: border-color 0.2s;
  }
  .add-photo-btn:hover { border-color: var(--accent); color: var(--accent); }

  .modal-footer {
    padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
  }

  .btn-row { display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 13px; border-radius: 14px; border: none;
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.82; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-cancel { background: var(--surface2); color: var(--text2); border: 1.5px solid var(--border); }

  .btn-delete {
    width: 100%; padding: 12px; border-radius: 14px;
    border: 1.5px solid #e8c4c4; background: #fdf5f5; color: #c0392b;
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }

  /* Project modal — still bottom sheet */
  .proj-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(30,24,16,0.45); z-index: 400;
    align-items: flex-end; backdrop-filter: blur(2px);
  }
  .proj-overlay.open { display: flex; }
  .proj-modal {
    background: var(--surface); border-radius: 24px 24px 0 0;
    padding: 20px 18px 44px; width: 100%;
    max-height: 80vh; overflow-y: auto;
    border-top: 1.5px solid var(--border);
  }
  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
  .proj-title { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 19px; margin-bottom: 18px; text-align: center; }

  .proj-field { margin-bottom: 13px; }
  .proj-field label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.6px; }
  .proj-field input {
    width: 100%; background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 11px 13px; color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 15px; outline: none; -webkit-appearance: none;
  }
  .proj-field input:focus { border-color: var(--accent); }

  .color-picker { display: flex; gap: 10px; flex-wrap: wrap; }
  .color-opt {
    width: 32px; height: 32px; border-radius: 50%;
    border: 3px solid transparent; cursor: pointer; transition: transform 0.15s, border-color 0.15s;
  }
  .color-opt.selected { border-color: var(--text); transform: scale(1.15); }

  /* Lightbox */
  .lightbox {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.92); z-index: 500;
    align-items: center; justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100vh; object-fit: contain; }
  .lightbox-close {
    position: absolute; top: 16px; right: 16px;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: none; color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  /* Empty / Loading */
  .empty { text-align: center; padding: 56px 20px; color: var(--muted); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
  .empty p { font-size: 14px; line-height: 1.6; }

  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .spinner {
    width: 28px; height: 28px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #fff; padding: 9px 20px; border-radius: 20px;
    font-size: 13px; font-weight: 500; z-index: 600; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  .toast.show { opacity: 1; }

  .batch-bar {
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: 64px;
    z-index: 260;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    padding: 8px;
    display: none;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .batch-count {
    font-size: 11px;
    font-weight: 700;
    color: var(--text2);
    margin-right: 2px;
    padding: 0 4px;
  }
  .batch-btn {
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 11px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .batch-btn.danger {
    border-color: #e8c4c4;
    background: #fdf5f5;
    color: #c0392b;
  }

  /* ── MEDIA LIBRARY (стоки) ── */
  .nav-media {
    width: 46px; border: none;
    background: transparent; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--muted); flex-shrink: 0; transition: color 0.2s;
  }
  .nav-media:hover { color: var(--accent); }

  .media-topbar { display: flex; gap: 8px; align-items: center; }
  .media-search {
    flex: 1;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .media-upload-btn {
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
  }
  .media-item {
    display: flex;
    gap: 10px;
    align-items: center;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 14px;
    padding: 10px;
  }
  .media-thumb {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-weight: 800;
    font-size: 11px;
  }
  .media-thumb img, .media-thumb video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .media-meta { flex: 1; min-width: 0; }
  .media-name {
    font-weight: 800;
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .media-tags {
    margin-top: 2px;
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .media-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .media-action-btn {
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
  }
  .media-action-btn.danger {
    border-color: #e8c4c4;
    background: #fdf5f5;
    color: #c0392b;
  }
  .mini-icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .mini-icon-btn.danger {
    border-color: #e8c4c4;
    background: #fdf5f5;
    color: #c0392b;
  }
  .upload-row {
    border: 1.5px dashed var(--border);
    background: var(--surface);
    border-radius: 14px;
    padding: 10px 12px;
  }
  .upload-title { font-weight: 800; font-size: 12px; color: var(--text2); }
  .upload-progress {
    margin-top: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--surface2);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .upload-progress > div {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .upload-hint { margin-top: 6px; font-size: 11px; color: var(--muted); }

  .no-project {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 80px 30px; text-align: center; gap: 16px;
  }
  .no-project svg { color: var(--muted); opacity: 0.4; }
  .no-project h2 { font-family: 'Playfair Display', serif; color: var(--text2); font-size: 20px; }
  .no-project p { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .no-project button {
    padding: 12px 28px; background: var(--accent); color: #fff; border: none;
    border-radius: 14px; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen" style="
  position:fixed;inset:0;background:var(--bg);z-index:1000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;
">
  <div style="font-family:'Playfair Display',serif;font-size:28px;color:var(--accent);margin-bottom:8px">Сценарии</div>
  <div style="font-size:13px;color:var(--muted);margin-bottom:40px">Введи пароль для входа</div>

  <div style="width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px">
    <input id="login-input" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" placeholder="Пароль..." style="
      width:100%;padding:14px 16px;background:var(--surface);
      border:1.5px solid var(--border);border-radius:14px;
      font-family:'Inter',sans-serif;font-size:16px;color:var(--text);
      outline:none;text-align:center;letter-spacing:3px;
    " onkeydown="if(event.key==='Enter')doLogin()">

    <button onclick="doLogin()" style="
      width:100%;padding:14px;background:var(--accent);color:#fff;
      border:none;border-radius:14px;font-family:'Inter',sans-serif;
      font-size:16px;font-weight:700;cursor:pointer;
    ">Войти</button>

    <div id="login-error" style="
      text-align:center;color:#c0392b;font-size:13px;display:none;
    ">Неверный пароль</div>
  </div>
</div>
<header>
  <div class="header-line1">
    <div class="project-dot" id="header-dot"></div>
    <h1 id="header-title" style="flex:1">Сценарии</h1>
    <button id="sync-btn" onclick="manualSync()" style="
      display:none;
      padding:6px 10px;border-radius:20px;border:1.5px solid var(--border);
      background:var(--surface2);color:var(--text2);
      font-size:11px;font-weight:800;cursor:pointer;flex-shrink:0;
    ">Синк: <span id="sync-count">0</span></button>
    <button id="search-toggle" onclick="toggleSearch()" style="
      width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);
      background:var(--surface2);display:flex;align-items:center;justify-content:center;
      cursor:pointer;color:var(--muted);flex-shrink:0;
    ">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button id="multi-toggle" onclick="toggleSelectionMode()" style="
      width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);
      background:var(--surface2);display:none;align-items:center;justify-content:center;
      cursor:pointer;color:var(--muted);flex-shrink:0;
    ">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <path d="M7 12h.01M12 12h.01M17 12h.01"></path>
      </svg>
    </button>
  </div>
  <div id="search-bar" style="display:none;margin-bottom:6px">
    <input id="search-input" type="text" placeholder="Поиск по названию и описанию..."
      oninput="renderWithSearch()"
      style="width:100%;padding:9px 14px;background:var(--surface);border:1.5px solid var(--accent);
      border-radius:12px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);outline:none;">
  </div>
  <div class="header-line2" id="header-line2">
    <span class="counter-pill" id="counter"></span>
    <!-- hero pills injected here -->
  </div>
</header>

<div id="main-content">
  <div class="loading"><div class="spinner"></div>Загрузка...</div>
</div>

<button class="fab" id="fab" onclick="openScenarioModal()" style="display:none">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</button>

<nav class="bottom-nav">
  <div class="nav-projects" id="nav-projects"></div>
  <div class="nav-actions">
    <button class="nav-add-project" onclick="openProjectModal()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
    <button class="nav-media" onclick="openMediaModal()" title="Медиатека">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
        <path d="M7 16l3-3 3 3 4-4"></path>
        <circle cx="8" cy="8" r="1.2"></circle>
      </svg>
    </button>
    <button class="nav-calendar" onclick="openCalendarModal()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    </button>
  </div>
</nav>

<!-- Scenario Modal (fullscreen) -->
<div class="overlay" id="scenario-overlay">
  <div class="modal-header">
    <button class="modal-back" onclick="closeScenarioModal()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="modal-header-title" id="scenario-modal-title">Новый сценарий</div>
    <button id="copy-btn" onclick="copyFromEdit()" style="display:none;
      width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);
      background:var(--surface2);color:var(--muted);cursor:pointer;
      align-items:center;justify-content:center;flex-shrink:0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="9" y="9" width="11" height="11" rx="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
    </button>
    <button id="delete-btn" onclick="deleteFromEdit()" style="display:none;
      width:36px;height:36px;border-radius:50%;border:1.5px solid #e8c4c4;
      background:#fdf5f5;color:#c0392b;cursor:pointer;
      display:none;align-items:center;justify-content:center;flex-shrink:0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    </button>
  </div>

  <div class="modal-body">
    <div class="field">
      <label>Главный герой</label>
      <div class="hero-quick" id="hero-quick"></div>
      <input type="text" id="inp-hero" placeholder="Имя героя..." oninput="renderHeroQuick()">
    </div>

    <div class="field">
      <label>Название сценария</label>
      <input type="text" id="inp-title" placeholder="Название сценария">
    </div>

    <div class="field">
      <label>Описание / идея</label>
      <div id="desc-preview" onclick="openTextEditor()" style="
        min-height: 56px; padding: 12px 14px;
        background: var(--surface); border: 1.5px solid var(--border);
        border-radius: 12px; font-size: 15px; color: var(--text);
        line-height: 1.5; white-space: pre-wrap; cursor: pointer;
        font-family: 'Inter', sans-serif;
      "></div>
    </div>

    <div class="field">
      <label>Статус</label>
      <div class="status-select">
        <button type="button" class="status-opt selected" id="opt-active" onclick="selectStatus('active')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 6 12 12 16 14"/></svg>
          Активный
        </button>
        <button type="button" class="status-opt draft" id="opt-draft" onclick="selectStatus('draft')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Доработать
        </button>
        <button type="button" class="status-opt done" id="opt-done" onclick="selectStatus('done')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          Готово
        </button>
      </div>
    </div>

    <div class="field">
      <label>Дата выпуска</label>
      <input type="date" id="inp-release-date">
    </div>

    <div class="field">
      <label>Фото</label>
      <div class="photos-upload-strip" id="photos-strip">
        <div class="add-photo-btn" onclick="document.getElementById('file-input').click()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Добавить
        </div>
      </div>
      <input type="file" id="file-input" accept="image/*" multiple style="display:none" onchange="handleFiles(event)">
    </div>
  </div>

  <div class="modal-footer">
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeScenarioModal()">Отмена</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveScenario()">Сохранить</button>
    </div>
  </div>
</div>

<!-- Calendar Modal -->
<div class="overlay" id="calendar-overlay">
  <div class="modal-header">
    <button class="modal-back" onclick="closeCalendarModal()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="modal-header-title">Календарный план</div>
  </div>
  <div class="modal-body">
    <div class="calendar-month">
      <button class="calendar-nav-btn" onclick="changeCalendarMonth(-1)">‹</button>
      <div class="calendar-month-title" id="calendar-month-title"></div>
      <button class="calendar-nav-btn" onclick="changeCalendarMonth(1)">›</button>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
    <!-- Кнопка "Отчет дня" для прошедшей выбранной даты -->
    <div id="calendar-day-report-actions" style="margin-top:10px"></div>
    <div class="calendar-plan-list" id="calendar-plan-list"></div>
  </div>
</div>

<!-- Отчет по прошедшей дате (эффективность + ссылка на ролик) -->
<div class="proj-overlay" id="result-overlay" onclick="closeResultModalOutside(event)">
  <div class="proj-modal" style="padding-bottom:26px">
    <div class="modal-handle"></div>
    <div class="proj-title" id="result-title">Отчет</div>

    <div class="proj-field">
      <label>Ссылка на ролик в Instagram</label>
      <input type="text" id="result-ig-url" placeholder="Вставь ссылку..." oninput="updateResultIgPreview()">
      <div id="result-ig-preview" style="margin-top:10px"></div>
    </div>

    <div class="proj-field">
      <label>Скрины эффективности (до 50MB файл)</label>
      <div id="result-upload-queue" style="display:none;flex-direction:column;gap:8px"></div>
      <button class="media-upload-btn" style="width:100%;margin-top:8px" onclick="document.getElementById('result-file-input').click()">+ Добавить скрины</button>
      <input type="file" id="result-file-input" accept="image/*" style="display:none" multiple onchange="handleResultFiles(event)">
      <div id="result-thumbs" style="margin-top:10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none"></div>
    </div>

    <div class="proj-field">
      <label>Заметка</label>
      <textarea id="result-note" placeholder="Например: что сработало, что улучшить..." style="
        width:100%;min-height:110px;resize:vertical;
        padding:12px 14px;border-radius:12px;
        border:1.5px solid var(--border);background:var(--surface);
        font-family:'Inter',sans-serif;font-size:14px;color:var(--text);
        outline:none;
      "></textarea>
    </div>

    <div class="btn-row" style="margin-top:14px">
      <button class="btn btn-cancel" onclick="closeResultModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveResult()">Сохранить</button>
    </div>
  </div>
</div>

<!-- Отчет ДНЯ (для прошедшей даты, даже если нет сценариев) -->
<div class="proj-overlay" id="day-result-overlay" onclick="closeDayResultModalOutside(event)">
  <div class="proj-modal" style="padding-bottom:26px">
    <div class="modal-handle"></div>
    <div class="proj-title" id="day-result-title">Отчет дня</div>

    <div class="proj-field">
      <label>Ссылка на ролик в Instagram</label>
      <input type="text" id="day-result-ig-url" placeholder="Вставь ссылку..." oninput="updateDayResultIgPreview()">
      <div id="day-result-ig-preview" style="margin-top:10px"></div>
    </div>

    <div class="proj-field">
      <label>Скрины эффективности (до 50MB файл)</label>
      <div id="day-result-upload-queue" style="display:none;flex-direction:column;gap:8px"></div>
      <button class="media-upload-btn" style="width:100%;margin-top:8px" onclick="document.getElementById('day-result-file-input').click()">+ Добавить скрины</button>
      <input type="file" id="day-result-file-input" accept="image/*" style="display:none" multiple onchange="handleDayResultFiles(event)">
      <div id="day-result-thumbs" style="margin-top:10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none"></div>
    </div>

    <div class="proj-field">
      <label>Заметка</label>
      <textarea id="day-result-note" placeholder="Например: что сработало, что улучшить..." style="
        width:100%;min-height:110px;resize:vertical;
        padding:12px 14px;border-radius:12px;
        border:1.5px solid var(--border);background:var(--surface);
        font-family:'Inter',sans-serif;font-size:14px;color:var(--text);
        outline:none;
      "></textarea>
    </div>

    <div class="btn-row" style="margin-top:14px">
      <button class="btn btn-cancel" onclick="closeDayResultModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveDayResult()">Сохранить</button>
    </div>
  </div>
</div>

<!-- Выбор сценария для даты (открывается по "+" в календаре) -->
<div class="proj-overlay" id="calendar-pick-overlay" onclick="closeCalendarPickOutside(event)">
  <div class="proj-modal" style="padding-bottom:26px">
    <div class="modal-handle"></div>
    <div class="proj-title" id="calendar-pick-title">Выбери сценарий</div>
    <div id="calendar-pick-list" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn btn-cancel" onclick="closeCalendarPick()">Закрыть</button>
    </div>
  </div>
</div>

<!-- Медиатека (стоки): фото/видео (на Free плане до 50MB на файл) -->
<div class="proj-overlay" id="media-overlay" onclick="closeMediaModalOutside(event)">

function isNetworkError(e) {
  const msg = (e && e.message ? e.message : String(e || '')).toLowerCase();
  return !navigator.onLine || msg.includes('failed to fetch') || msg.includes('networkerror');

  try { offlineQueue = JSON.parse(localStorage.getItem(LS_OFFLINE_QUEUE_KEY) || '[]') || []; } catch(e) { offlineQueue = []; }

}

async function manualSync() {

  showToast('Синхронизация...');

}

function replaceTempScenarioId(tempId, created) {
  const idx = scenarios.findIndex(s => s.id === tempId);
  if (idx !== -1) scenarios[idx] = created;
  const list = scenariosByProjectCache[created.project_id] || [];
  const cidx = list.findIndex(s => s.id === tempId);
  if (cidx !== -1) list[cidx] = created;
}

async function syncOfflineQueue() {
  if (syncingOfflineQueue || offlineQueue.length === 0 || !navigator.onLine) return;
  syncingOfflineQueue = true;
  try {
    while (offlineQueue.length > 0) {
      const op = offlineQueue[0];
      if (op.type === 'scenario_create') {
        const created = await api('/rest/v1/scenarios', 'POST', op.payload);
        if (created && created[0]) replaceTempScenarioId(op.tempId, created[0]);
      } else if (op.type === 'scenario_update') {
        await api(`/rest/v1/scenarios?id=eq.${op.id}`, 'PATCH', op.payload);
      } else if (op.type === 'scenario_delete') {
        await api(`/rest/v1/scenarios?id=eq.${op.id}`, 'DELETE');
      } else if (op.type === 'project_create') {
        await api('/rest/v1/projects', 'POST', op.payload);
      } else if (op.type === 'project_update') {
        await api(`/rest/v1/projects?id=eq.${op.id}`, 'PATCH', op.payload);
      } else if (op.type === 'project_delete') {
        await api(`/rest/v1/projects?id=eq.${op.id}`, 'DELETE');
      }
      offlineQueue.shift();
      saveOfflineQueue();
      updateSyncBadge();
    }
    persistProjectsCache();
    persistScenariosCache();
    if (currentProjectId) await loadScenarios();
    showToast('Синхронизировано');
  } catch (e) {
    if (!isNetworkError(e)) {
      showToast('Синк не прошел: попробуй еще раз');
    }
  } finally {
    syncingOfflineQueue = false;
    updateSyncBadge();
  }
}

async function api(path, method = 'GET', body = null) {
  const res = await fetch(SUPABASE_URL + path, { method, headers: H, body: body ? JSON.stringify(body) : null });
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// Загрузка файла с прогрессом (для фото/видео).
// Важно: на Free плане Supabase максимум 50MB на файл.
function uploadFileToBucketWithProgress(file, bucketName, onProgress) {
  return new Promise((resolve, reject) => {
    const ext = (file.name || '').split('.').pop() || 'bin';
    const name = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
    const url = `${SUPABASE_URL}/storage/v1/object/${bucketName}/${name}`;

    const xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.setRequestHeader('apikey', SUPABASE_KEY);
    xhr.setRequestHeader('Authorization', `Bearer ${SUPABASE_KEY}`);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const pct = Math.round((e.loaded / e.total) * 100);
      if (onProgress) onProgress(pct, e.loaded, e.total);
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        resolve(`${SUPABASE_URL}/storage/v1/object/public/${bucketName}/${name}`);
      } else {
        const msg = (xhr.responseText || '').slice(0, 400);
        reject(new Error(msg || `Upload failed (${xhr.status})`));
      }
    };
    xhr.onerror = () => reject(new Error('Upload failed'));
    xhr.send(file);
  });
}

    ${isAdmin() ? `<button class="status-btn" onclick="editScenario(${s.id})" style="color:var(--muted)">${editIcon}</button>` : ''}
  </div>`;
  const selectBtn = (selectionMode && isAdmin())
    ? `<button class="multi-select-btn ${isSelected ? 'selected' : ''}" onclick="toggleScenarioSelection(${s.id})">${isSelected ? '✓' : ''}</button>`
    : '';

  return `
    <div class="scenario-card status-${status}">
      <div class="status-bar"></div>
      <div class="card-main">
        ${selectBtn}
        <div class="num">${numStr}</div>
        <div class="card-content">${hero}<div class="card-title">${escapeHtml(s.title)}</div>${desc}</div>
        ${btns}
      </div>
      ${photosHTML}
    </div>`;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateCounter() {
  const active = scenarios.filter(s => s.status === 'active').length;
  const draft = scenarios.filter(s => s.status === 'draft').length;
  document.getElementById('counter').textContent = `${active} акт · ${draft} черн`;
}

async function cycleStatus(id) {
  const s = scenarios.find(x => x.id === id); if (!s) return;
  const order = ['active','draft','done'];
  const next = order[(order.indexOf(s.status || 'active') + 1) % 3];
  try {
    await api(`/rest/v1/scenarios?id=eq.${id}`, 'PATCH', { status: next });
    s.status = next; render();
    persistScenariosCache();
    showToast({ active: 'Активный', draft: 'Доработать', done: 'Готово' }[next]);
  } catch(e) {
    if (!isNetworkError(e)) { showToast('Ошибка'); return; }
    s.status = next;
    enqueueOfflineOp({ type: 'scenario_update', id, payload: { status: next } });
    persistScenariosCache();
    render();
    showToast('Нет сети: изменено локально');
  }
}

async function deleteFromEdit() {
  if (!editingScenarioId || !confirm('Удалить сценарий?')) return;
  try {
    await api(`/rest/v1/scenarios?id=eq.${editingScenarioId}`, 'DELETE');
    scenarios = scenarios.filter(s => s.id !== editingScenarioId);
    persistScenariosCache();
    render(); closeScenarioModal(); showToast('Удалено');
  } catch(e) {
    if (!isNetworkError(e)) { showToast('Ошибка'); return; }
    scenarios = scenarios.filter(s => s.id !== editingScenarioId);
    enqueueOfflineOp({ type: 'scenario_delete', id: editingScenarioId });
    persistScenariosCache();
    render(); closeScenarioModal(); showToast('Нет сети: удаление в очереди');
  }
}

async function copyFromEdit() {
  if (!editingScenarioId) return;
  const copyBtn = document.getElementById('copy-btn');
  const copyIconDefault = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="9" y="9" width="11" height="11" rx="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
  `;
  const copyIconDone = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
  `;
  const showCopySuccess = () => {
    if (!copyBtn) return;
    copyBtn.style.borderColor = 'var(--accent)';
    copyBtn.style.background = '#fdf3ec';
    copyBtn.style.color = 'var(--accent)';
    copyBtn.innerHTML = copyIconDone;
    setTimeout(() => {
      copyBtn.style.borderColor = 'var(--border)';
      copyBtn.style.background = 'var(--surface2)';
      copyBtn.style.color = 'var(--muted)';
      copyBtn.innerHTML = copyIconDefault;
    }, 1000);
  };
  const title = document.getElementById('inp-title').value.trim();
  const desc = document.getElementById('inp-desc').value.trim();
  const text = desc ? `${title}\n${desc}` : title;
  if (!text) { showToast('Нечего копировать'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showToast('Скопировано');
    showCopySuccess();
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Скопировано');
    showCopySuccess();
  }
}

// ── PHOTOS ──
function handleFiles(e) {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    const url = URL.createObjectURL(file);
    pendingPhotos.push({ url, file, isExisting: false });
  });
  e.target.value = '';
  renderPhotosStrip();
  queueScenarioDraftAutosave();
}

function handlePasteImages(event) {
  if (!document.getElementById('scenario-overlay').classList.contains('open')) return;
  const items = event.clipboardData && event.clipboardData.items ? Array.from(event.clipboardData.items) : [];
  if (items.length === 0) return;

  const imageItems = items.filter(item => item.type && item.type.startsWith('image/'));
  if (imageItems.length === 0) return;

  let added = 0;
  imageItems.forEach(item => {
    const file = item.getAsFile();
    if (!file) return;
    const url = URL.createObjectURL(file);
    pendingPhotos.push({ url, file, isExisting: false });
    added++;
  });

  if (added > 0) {
    event.preventDefault();
    renderPhotosStrip();
    queueScenarioDraftAutosave();
    showToast(added === 1 ? 'Фото вставлено' : `Фото вставлены: ${added}`);
  }
}

function removePhoto(idx) {
  pendingPhotos.splice(idx, 1);
  renderPhotosStrip();
  queueScenarioDraftAutosave();
}

function renderPhotosStrip() {
  const strip = document.getElementById('photos-strip');
  let html = pendingPhotos.map((p, i) => `
    <div class="photo-thumb-wrap">
      <img src="${p.url}" onclick="openLightbox('${p.url}')">
      <div class="photo-remove" onclick="removePhoto(${i})">×</div>
    </div>`).join('');
  html += `<div class="add-photo-btn" onclick="document.getElementById('file-input').click()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    Добавить
  </div>`;
  strip.innerHTML = html;
}

function hasScenarioDraftContent(draft) {
  if (!draft) return false;
  return !!(draft.hero || draft.title || draft.desc || draft.releaseDate || (draft.photos && draft.photos.length > 0));
}

function queueScenarioDraftAutosave() {
  if (editingScenarioId) return;
  const overlay = document.getElementById('scenario-overlay');
  if (!overlay.classList.contains('open')) return;
  clearTimeout(draftAutosaveTimer);
  draftAutosaveTimer = setTimeout(() => {
    saveScenarioDraft();
  }, 350);
}

function saveScenarioDraft() {
  if (editingScenarioId) return; // only for "new scenario" modal
  const draft = {
    hero: document.getElementById('inp-hero').value || '',
    title: document.getElementById('inp-title').value || '',
    desc: document.getElementById('inp-desc').value || '',
    releaseDate: document.getElementById('inp-release-date').value || '',
    status: currentStatus || 'active',
    photos: pendingPhotos.map(p => ({ url: p.url, file: p.file, isExisting: p.isExisting }))
  };
  scenarioDraftCache = hasScenarioDraftContent(draft) ? draft : null;
  return !!scenarioDraftCache;
}

function restoreScenarioDraft() {
  if (!hasScenarioDraftContent(scenarioDraftCache)) return;
  document.getElementById('inp-hero').value = scenarioDraftCache.hero || '';
  document.getElementById('inp-title').value = scenarioDraftCache.title || '';
  document.getElementById('inp-desc').value = scenarioDraftCache.desc || '';
  document.getElementById('inp-release-date').value = scenarioDraftCache.releaseDate || '';
  const preview = document.getElementById('desc-preview');
  preview.textContent = scenarioDraftCache.desc || 'Нажми чтобы добавить описание...';
  preview.style.color = scenarioDraftCache.desc ? 'var(--text)' : 'var(--muted)';
  selectStatus(scenarioDraftCache.status || 'active');
  pendingPhotos = (scenarioDraftCache.photos || []).map(p => ({ url: p.url, file: p.file, isExisting: p.isExisting }));
  renderPhotosStrip();
  renderHeroQuick();
  showToast('Черновик восстановлен');
}

function clearScenarioDraft() {
  scenarioDraftCache = null;
}

async function uploadFileToBucket(file, bucketName = BUCKET_SCENARIOS) {
  const name = `${Date.now()}_${Math.random().toString(36).slice(2)}.${file.name.split('.').pop()}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${bucketName}/${name}`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': file.type },
    body: file
  });
  if (!res.ok) throw new Error('Upload failed');
  return `${SUPABASE_URL}/storage/v1/object/public/${bucketName}/${name}`;
}

function openScenarioModal(options = {}) {
  renderHeroQuick();
  history.pushState({ modal: 'scenario' }, '');
  document.getElementById('scenario-overlay').classList.add('open');
  if (!options.fromEdit) restoreScenarioDraft();
}

function closeScenarioModal(preserveDraft = true, fromPopState = false) {
  // На телефоне кнопка "назад" должна закрывать текущее окно на 1 шаг.
  // Поэтому при закрытии через UI делаем history.back(), а реальное закрытие делаем в обработчике popstate.
  const overlay = document.getElementById('scenario-overlay');
  if (!fromPopState && overlay && overlay.classList.contains('open')) {
    if (preserveDraft) saveScenarioDraft();
    clearTimeout(draftAutosaveTimer);
    history.back();
    return;
  }

  const savedDraft = preserveDraft ? saveScenarioDraft() : false;
  clearTimeout(draftAutosaveTimer);
  document.getElementById('scenario-overlay').classList.remove('open');
  document.getElementById('inp-hero').value = '';
  document.getElementById('inp-title').value = '';
  document.getElementById('inp-desc').value = '';
  document.getElementById('inp-release-date').value = '';
  const preview = document.getElementById('desc-preview');
  preview.textContent = 'Нажми чтобы добавить описание...';
  preview.style.color = 'var(--muted)';
  selectStatus('active');
  pendingPhotos = [];
  renderPhotosStrip();
  document.getElementById('scenario-modal-title').textContent = 'Новый сценарий';
  document.getElementById('save-btn').textContent = 'Сохранить';
  document.getElementById('copy-btn').style.display = 'none';
  document.getElementById('delete-btn').style.display = 'none';
  editingScenarioId = null;
  if (savedDraft) showToast('Черновик сохранен');
}

window.addEventListener('popstate', () => {
  // Закрываем самый верхний "слой" (как стек), чтобы "назад" не уносил в начало.
  if (document.getElementById('lightbox').classList.contains('open')) {
    closeLightbox(true);
  } else if (document.getElementById('calendar-pick-overlay').classList.contains('open')) {
    closeCalendarPick(true);
  } else if (document.getElementById('day-result-overlay') && document.getElementById('day-result-overlay').classList.contains('open')) {
    closeDayResultModal(true);
  } else if (document.getElementById('result-overlay') && document.getElementById('result-overlay').classList.contains('open')) {
    closeResultModal(true);
  } else if (document.getElementById('media-overlay') && document.getElementById('media-overlay').classList.contains('open')) {
    closeMediaModal(true);
  } else if (document.getElementById('text-editor-overlay').classList.contains('open')) {
    closeTextEditor(true);
  } else if (document.getElementById('calendar-overlay').classList.contains('open')) {
    closeCalendarModal(true);
  } else if (document.getElementById('scenario-overlay').classList.contains('open')) {
    closeScenarioModal(true, true);
  }
});

function selectHeroQuick(name) { document.getElementById('inp-hero').value = name; renderHeroQuick(); queueScenarioDraftAutosave(); }

async function saveScenario() {
  const title = document.getElementById('inp-title').value.trim();
  if (!title) { showToast('Введи название'); return; }
  const btn = document.getElementById('save-btn');
  btn.textContent = 'Сохраняю...'; btn.disabled = true;
  let payload = null;
  try {
    if (!currentProjectId) {
      showToast('Сначала выбери проект');
      btn.textContent = 'Сохранить'; btn.disabled = false;
      return;
    }
    // Upload new files
    for (let p of pendingPhotos) {
      if (!p.isExisting && p.file) {
        // Загружаем фото сценария в бакет scenarios
        p.url = await uploadFileToBucket(p.file, BUCKET_SCENARIOS);
        p.isExisting = true;
      }
    }
    const urls = pendingPhotos.map(p => p.url);
    const image_url = urls.length > 0 ? JSON.stringify(urls) : null;

    payload = {
      title,
      description: document.getElementById('inp-desc').value || null,
      hero: document.getElementById('inp-hero').value.trim() || null,
      status: currentStatus,
      image_url,
      project_id: currentProjectId,
      release_date: (document.getElementById('inp-release-date').value || null)
    };
    if (editingScenarioId) {
      await api(`/rest/v1/scenarios?id=eq.${editingScenarioId}`, 'PATCH', payload);
      const idx = scenarios.findIndex(s => s.id === editingScenarioId);
      scenarios[idx] = { ...scenarios[idx], ...payload };
      persistScenariosCache();
      showToast('Обновлено');
    } else {
      const positions = scenarios.map(s => s.position).filter(p => typeof p === 'number' && !isNaN(p));
      const maxPos = positions.length > 0 ? Math.max(...positions) : 0;
      payload.position = maxPos + 1;
      const created = await api('/rest/v1/scenarios', 'POST', payload);
      if (created && created[0]) {
        scenarios.push(created[0]);
        persistScenariosCache();
        showToast('Сценарий добавлен');
      } else {
        await loadScenarios();
        showToast('Сценарий добавлен');
      }
    }
    clearScenarioDraft();
    render(); closeScenarioModal(false);
  } catch(e) {
    if (!isNetworkError(e)) { showToast('Ошибка'); console.error(e); }
    else {
      if (editingScenarioId) {
        const idx = scenarios.findIndex(s => s.id === editingScenarioId);
        if (idx !== -1) scenarios[idx] = { ...scenarios[idx], ...payload };
        enqueueOfflineOp({ type: 'scenario_update', id: editingScenarioId, payload });
        persistScenariosCache();
        showToast('Нет сети: обновление в очереди');
      } else {
        const tempId = -Date.now();
        const tempItem = { id: tempId, created_at: new Date().toISOString(), ...payload };
        scenarios.push(tempItem);
        enqueueOfflineOp({ type: 'scenario_create', tempId, payload });
        persistScenariosCache();
        showToast('Нет сети: сценарий сохранен локально');
      }
      clearScenarioDraft();
      render(); closeScenarioModal(false);
    }
  }
  finally { btn.textContent = editingScenarioId ? 'Обновить' : 'Сохранить'; btn.disabled = false; }
}

async function saveProject() {

  const btn = document.getElementById('proj-save-btn');
  btn.textContent = 'Сохраняю...'; btn.disabled = true;
  const payload = { name, color: selectedColor };
  try {
    if (editingProjectId) {
      await api(`/rest/v1/projects?id=eq.${editingProjectId}`, 'PATCH', payload);
      const idx = projects.findIndex(p => p.id === editingProjectId);
      projects[idx] = { ...projects[idx], ...payload };
      persistProjectsCache();
      showToast('Проект обновлён');
    } else {
      const created = await api('/rest/v1/projects', 'POST', payload);
      if (created && created[0]) {
        projects.push(created[0]);
        currentProjectId = created[0].id;
        persistProjectsCache();
        await loadScenarios();
        showToast('Проект создан');
      } else {
        await loadProjects();
        showToast('Проект создан');
      }
    }
    renderNav(); updateHeader(); closeProjectModal();
  } catch(e) {
    if (!isNetworkError(e)) { showToast('Ошибка'); }
    else {
      if (editingProjectId) {
        const idx = projects.findIndex(p => p.id === editingProjectId);
        if (idx !== -1) projects[idx] = { ...projects[idx], ...payload };
        enqueueOfflineOp({ type: 'project_update', id: editingProjectId, payload });
        persistProjectsCache();
        renderNav();
        showToast('Нет сети: проект обновится позже');
      } else {
        const tempId = -Date.now();
        const tempProject = { id: tempId, ...payload };
        projects.push(tempProject);
        enqueueOfflineOp({ type: 'project_create', payload });
        persistProjectsCache();
        currentProjectId = tempId;
        scenarios = [];
        persistScenariosCache();
        renderNav(); render();
        showToast('Нет сети: проект сохранен локально');
      }
      closeProjectModal();
    }
  }
  finally { btn.textContent = editingProjectId ? 'Сохранить' : 'Создать'; btn.disabled = false; }
}

async function deleteProject() {
  if (!editingProjectId || !confirm('Удалить проект?')) return;
  try {
    await api(`/rest/v1/projects?id=eq.${editingProjectId}`, 'DELETE');
    projects = projects.filter(p => p.id !== editingProjectId);
    persistProjectsCache();
    closeProjectModal();
    if (projects.length > 0) { currentProjectId = projects[0].id; renderNav(); await loadScenarios(); }
    else { currentProjectId = null; showNoProject(); renderNav(); }
    showToast('Проект удалён');
  } catch(e) {
    if (!isNetworkError(e)) { showToast('Ошибка'); return; }
    projects = projects.filter(p => p.id !== editingProjectId);
    enqueueOfflineOp({ type: 'project_delete', id: editingProjectId });
    persistProjectsCache();
    closeProjectModal();
    if (projects.length > 0) { currentProjectId = projects[0].id; renderNav(); scenarios = scenariosByProjectCache[currentProjectId] || []; render(); }
    else { currentProjectId = null; showNoProject(); renderNav(); }
    showToast('Нет сети: удаление в очереди');
  }
}

function formatDateLabelRu(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
}

function getCalendarItemsForDate(dateStr) {
  if (!dateStr) return [];
  return scenarios.filter(s => getScenarioReleaseDate(s.id) === dateStr);
}

function isPastDate(dateStr) {
  // Надежная проверка "прошедшая дата" без проблем с часовыми поясами.
  // Формат dateStr у нас: YYYY-MM-DD. Его можно сравнивать как строку.
  if (!dateStr) return false;
  const now = new Date();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  return String(dateStr) < todayStr;
}

async function loadCalendarResultsForDate(dateStr) {
  calendarResults = {};
  if (!dateStr || !currentProjectId) return;
  if (!isPastDate(dateStr)) return;
  try {
    const rows = await api(`/rest/v1/scenario_results?select=*&project_id=eq.${currentProjectId}&date=eq.${dateStr}`);
    (rows || []).forEach(r => {
      const imgs = r.images ? (typeof r.images === 'string' ? JSON.parse(r.images) : r.images) : [];
      calendarResults[r.scenario_id] = {
        id: r.id,
        ig_url: r.ig_url || '',
        images: Array.isArray(imgs) ? imgs : [],
        note: r.note || ''
      };
    });
  } catch (e) {
    // просто не показываем отчеты
  }
}

async function loadDayResultForDate(dateStr) {
  dayResult = null;
  editingDayResultId = null;
  if (!dateStr || !currentProjectId) return;
  if (!isPastDate(dateStr)) return;
  try {
    const rows = await api(`/rest/v1/day_results?select=*&project_id=eq.${currentProjectId}&date=eq.${dateStr}`);
    if (rows && rows[0]) {
      const r = rows[0];
      const imgs = r.images ? (typeof r.images === 'string' ? JSON.parse(r.images) : r.images) : [];
      dayResult = { id: r.id, ig_url: r.ig_url || '', images: Array.isArray(imgs) ? imgs : [], note: r.note || '' };
      editingDayResultId = r.id;
      // Обновляем кэш по месяцу, чтобы превью появлялось в самой клетке даты
      dayResultsByDate[dateStr] = { ...dayResult };
      // Подгружаем предпросмотр для ссылки (чтобы картинка появилась в календаре)
      if (dayResult.ig_url) fetchLinkPreview(dayResult.ig_url);
    }
  } catch (e) {
    // тихо
  }
}

async function loadDayResultsForMonth(monthDate) {
  dayResultsByDate = {};
  if (!currentProjectId || !monthDate) return;
  try {
    const start = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
    const end = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0);
    const startStr = `${start.getFullYear()}-${String(start.getMonth() + 1).padStart(2, '0')}-${String(start.getDate()).padStart(2, '0')}`;
    const endStr = `${end.getFullYear()}-${String(end.getMonth() + 1).padStart(2, '0')}-${String(end.getDate()).padStart(2, '0')}`;
    const rows = await api(`/rest/v1/day_results?select=*&project_id=eq.${currentProjectId}&date=gte.${startStr}&date=lte.${endStr}&order=date.asc`);
    (rows || []).forEach(r => {
      const imgs = r.images ? (typeof r.images === 'string' ? JSON.parse(r.images) : r.images) : [];
      const d = String(r.date);
      dayResultsByDate[d] = { id: r.id, ig_url: r.ig_url || '', images: Array.isArray(imgs) ? imgs : [], note: r.note || '' };
      if (dayResultsByDate[d].ig_url) fetchLinkPreview(dayResultsByDate[d].ig_url);
    });
  } catch (e) {
    // тихо
  }
}
